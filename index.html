  // ── Analytics ───────────────────────────────────────────────
  _analytics(year) {
    const plan   = this.activePlan();
    const cats   = this.cats(); // always all cats for display

    const allYearTxs = this.txs().filter(t => t.date && t.date.startsWith(String(year)));

    // Filter txs to the active plan:
    // 1. If tx has budget_ids, check if plan.id is in it
    // 2. If tx has no budget_ids (legacy/untagged), fall back to category matching
    const txs = plan
      ? allYearTxs.filter(t => {
          if (t.budget_ids?.length) return t.budget_ids.includes(plan.id);
          // Legacy fallback: match by category if plan has categoryLimits for it
          return plan.categoryLimits && (plan.categoryLimits[t.category] != null);
        })
      : allYearTxs;

    const budgets = this.budgets();
    const now = new Date();
    const curYear = now.getFullYear();
    const curMonth = now.getMonth() + 1;

    // Respect user-configured start date for elapsed month calculation
    const startDateStr = DB.get('startDate', null);
    let startYear, startMonth;
    if (startDateStr) {
      [startYear, startMonth] = startDateStr.split('-').map(Number);
    } else {
      startYear = parseInt(year); startMonth = 1;
    }

    let monthsElapsed;
    if (parseInt(year) < curYear) {
      // Past year: if startDate is in this year use partial, else full 12
      monthsElapsed = (parseInt(year) === startYear) ? Math.max(1, 12 - startMonth + 1) : 12;
    } else {
      // Current year: months from start of tracking through now
      const trackFrom = (parseInt(year) === startYear) ? startMonth : 1;
      monthsElapsed = Math.max(1, curMonth - trackFrom + 1);
    }
    const monthsRemaining = parseInt(year) === curYear ? Math.max(0, 12 - curMonth) : 0;

    const monthlySums = {}, monthlyByCat = {}, ytdByCat = {}, ytdBySubcat = {};
    txs.forEach(t => {
      const m = parseInt(t.date.split('-')[1]);
      if (!monthlySums[m]) monthlySums[m] = 0;
      monthlySums[m] += t.amount;
      if (!monthlyByCat[t.category]) monthlyByCat[t.category] = {};
      if (!monthlyByCat[t.category][m]) monthlyByCat[t.category][m] = 0;
      monthlyByCat[t.category][m] += t.amount;
      if (!ytdByCat[t.category]) ytdByCat[t.category] = 0;
      ytdByCat[t.category] += t.amount;
      // Track subcategory spend
      const subKey = `${t.category}||${t.subcategory||'(none)'}`;
      if (!ytdBySubcat[subKey]) ytdBySubcat[subKey] = 0;
      ytdBySubcat[subKey] += t.amount;
    });

    const totalYTD = txs.reduce((s,t) => s+t.amount, 0);
    // Use plan's category limits if a plan is active, else global budgets
    const getBudget = catName => plan ? (plan.categoryLimits?.[catName]||0) : (budgets[catName]||0);
    // Plan total budget: explicit monthlyLimit overrides, else sum category limits, else sum global
    const totalMonthlyBudget = plan
      ? (plan.monthlyLimit || cats.reduce((s,c) => s + (plan.categoryLimits?.[c.name]||0), 0))
      : cats.reduce((s,c) => s + (budgets[c.name]||0), 0);

    // Silently prune orphaned budget keys from global budgets (not plans)
    if (!plan) {
      const activeNames = new Set(cats.map(c=>c.name));
      const pruned = Object.fromEntries(Object.entries(budgets).filter(([k])=>activeNames.has(k)));
      if (Object.keys(pruned).length !== Object.keys(budgets).length) this.saveBudgets(pruned);
    }

    const avgMonthly = monthsElapsed > 0 ? totalYTD / monthsElapsed : 0;
    // Projected = actual YTD + (avg/mo × months still remaining this year)
    // This is distinct from avg*12 and answers "where will I finish the year?"
    const totalProjected = totalYTD + (avgMonthly * monthsRemaining);

    const catAnalytics = cats.map(cat => {
      const ytd = ytdByCat[cat.name]||0;
      const mb  = getBudget(cat.name);
      const avg = monthsElapsed > 0 ? ytd / monthsElapsed : 0;
      const proj = ytd + (avg * monthsRemaining);
      // Build subcategory breakdown for this category
      const subcatBreakdown = Object.entries(ytdBySubcat)
        .filter(([k]) => k.startsWith(cat.name + '||'))
        .map(([k, amt]) => ({ name: k.split('||')[1], amount: amt }))
        .sort((a,b) => b.amount - a.amount);
      return {
        ...cat,
        ytd, monthlyBudget: mb, annualBudget: mb*12,
        projectedAnnual: proj,
        avgMonthly: avg,
        monthlyData: monthlyByCat[cat.name]||{},
        subcatBreakdown,
      };
    });

    return { totalYTD, totalMonthlyBudget, totalProjected, avgMonthly,
             monthsElapsed, monthsRemaining, monthlySums, catAnalytics };
  },

  // ── Dashboard ───────────────────────────────────────────────
  _buildDashboard() {
    const data = this._analytics(this.s.dashYear);
    const { totalYTD, totalMonthlyBudget, totalProjected, monthsElapsed, monthlySums, catAnalytics } = data;
    const month = this.s.dashMonth;
    const monthSpend = monthlySums[month]||0;

    // If rollover is on, effective monthly budget = sum of (base + surplus) per cat
    const rolloverOn = DB.get('rolloverEnabled', false);
    const effectiveMonthlyBudget = rolloverOn
      ? catAnalytics.reduce((sum, cat) => {
          if (!cat.monthlyBudget) return sum;
          let carry = 0;
          for (let m = 1; m < month; m++) {
            const spent   = cat.monthlyData[m] || 0;
            const surplus = (cat.monthlyBudget + carry) - spent;
            carry = surplus > 0 ? surplus : 0;
          }
          return sum + cat.monthlyBudget + carry;
        }, 0)
      : totalMonthlyBudget;

    const ytdBudget = totalMonthlyBudget * monthsElapsed;
    const ytdDiff   = totalYTD - ytdBudget;

    const main = document.getElementById('main');
    const plans = this.budgetPlans();
    const planBarHtml = plans.length ? `
      <div style="display:flex;gap:6px;padding:8px 16px 0;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none;">
        <button class="plan-chip ${!this.s.activePlanId?'plan-chip-active':''}" data-pid="">🗂 All</button>
        ${plans.map(p=>`<button class="plan-chip ${this.s.activePlanId===p.id?'plan-chip-active':''}" data-pid="${p.id}" style="${this.s.activePlanId===p.id?`background:${p.color};color:#fff;border-color:${p.color};`:''}">
          ${p.icon} ${p.name}
        </button>`).join('')}
        <button id="plan-manage-btn" style="flex-shrink:0;padding:5px 10px;border-radius:99px;background:var(--bg);border:1px solid var(--border2);font-size:12px;font-weight:600;color:var(--t3);cursor:pointer;">⚙︎</button>
      </div>` : '';

    main.innerHTML = `<div class="view">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 16px 0;">
        <div class="view-title" style="padding:0;">${this.s.activePlanId ? (plans.find(p=>p.id===this.s.activePlanId)?.name||'Overview') : 'Overview'}</div>
        <button class="yr-pill" id="dash-yr-btn">${this.s.dashYear} ▾</button>
      </div>
      ${planBarHtml}
      <div class="hero">
        <div class="hero-lbl" id="hero-lbl">${this._monthFull(month)} spending</div>
        <div class="hero-amt" id="hero-amt">${this._$(monthSpend)}</div>
        <div class="hero-stats">
          <div class="hero-stat">
            <div class="stat-lbl">Monthly budget${rolloverOn && effectiveMonthlyBudget !== totalMonthlyBudget ? ' <span style="font-size:9px;color:var(--green);">+rollover</span>' : ''}</div>
            <div class="stat-val c-muted">${this._$(effectiveMonthlyBudget)}</div>
          </div>
          <div class="hero-stat"><div class="stat-lbl">YTD vs budget</div><div class="stat-val ${ytdDiff>0?'c-red':'c-green'}">${ytdDiff>0?'+':''}${this._$(ytdDiff)}</div></div>
          <div class="hero-stat"><div class="stat-lbl">Proj. annual</div><div class="stat-val ${totalProjected>totalMonthlyBudget*12?'c-red':'c-green'}">${this._$(totalProjected)}</div></div>
        </div>
      </div>
      <div class="month-nav">
        <button class="mnav-btn" id="prev-mo">‹</button>
        <div class="mnav-lbl" id="mnav-lbl">${this._monthFull(month)} ${this.s.dashYear}</div>
        <button class="mnav-btn" id="next-mo">›</button>
        ${(this.s.dashMonth !== new Date().getMonth()+1 || this.s.dashYear !== new Date().getFullYear()) ? `<button class="yr-pill" id="dash-today-btn" style="font-size:12px;padding:4px 10px;">Today</button>` : ''}
      </div>
      <div class="seg" id="dash-seg">
        <button class="seg-btn active" data-tab="monthly">Monthly</button>
        <button class="seg-btn" data-tab="annual">Annual</button>
      </div>
      <div id="dash-tab"></div>
    </div>`;

    document.getElementById('dash-yr-btn').onclick = () => this._openYearPicker('dash');

    // Plan selector chips
    document.querySelectorAll('.plan-chip').forEach(btn => {
      btn.addEventListener('click', () => {
        this.s.activePlanId = btn.dataset.pid || null;
        this._buildDashboard();
      });
    });
    const planManageBtn = document.getElementById('plan-manage-btn');
    if (planManageBtn) planManageBtn.onclick = () => this._buildBudgetPlansManager();
    const todayBtn = document.getElementById('dash-today-btn');
    if (todayBtn) todayBtn.onclick = () => {
      const n = new Date();
      this.s.dashMonth = n.getMonth()+1;
      this.s.dashYear  = n.getFullYear();
      this._buildDashboard();
    };
    document.getElementById('prev-mo').onclick = () => {
      let m=this.s.dashMonth-1, y=this.s.dashYear;
      if(m<1){m=12;y--;this.s.dashYear=y;}
      this.s.dashMonth=m; this._refreshDash(data);
    };
    document.getElementById('next-mo').onclick = () => {
      let m=this.s.dashMonth+1, y=this.s.dashYear;
      if(m>12){m=1;y++;this.s.dashYear=y;}
      this.s.dashMonth=m; this._refreshDash(data);
    };
    document.querySelectorAll('#dash-seg .seg-btn').forEach(btn => {
      btn.onclick = () => {
        document.querySelectorAll('#dash-seg .seg-btn').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        this._renderDashTab(btn.dataset.tab, data);
      };
    });
    this._renderDashTab('monthly', data);
  },

  _refreshDash(data) {
    const m = this.s.dashMonth;
    const ms = data.monthlySums[m]||0;
    document.getElementById('hero-lbl').textContent = `${this._monthFull(m)} spending`;
    document.getElementById('hero-amt').textContent = this._$(ms);
    document.getElementById('mnav-lbl').textContent = `${this._monthFull(m)} ${this.s.dashYear}`;

    // Show/hide the Today button dynamically
    const nav = document.querySelector('.month-nav');
    if (nav) {
      let todayBtn = document.getElementById('dash-today-btn');
      const isToday = this.s.dashMonth === new Date().getMonth()+1 && this.s.dashYear === new Date().getFullYear();
      if (!isToday && !todayBtn) {
        const btn = document.createElement('button');
        btn.id = 'dash-today-btn';
        btn.className = 'yr-pill';
        btn.style.cssText = 'font-size:12px;padding:4px 10px;';
        btn.textContent = 'Today';
        btn.onclick = () => {
          const n = new Date();
          this.s.dashMonth = n.getMonth()+1;
          this.s.dashYear  = n.getFullYear();
          this._buildDashboard();
        };
        nav.appendChild(btn);
      } else if (isToday && todayBtn) {
        todayBtn.remove();
      }
    }

    const activeTab = document.querySelector('#dash-seg .seg-btn.active');
    if (activeTab) this._renderDashTab(activeTab.dataset.tab, data);
  },

  _renderDashTab(tab, data) {
    const { catAnalytics, totalMonthlyBudget, monthlySums } = data;
    const content = document.getElementById('dash-tab');
    const month = this.s.dashMonth;

    if (tab === 'monthly') {
      const monthSpends = Array.from({length:12},(_,i)=>monthlySums[i+1]||0);
      const stackedMode = DB.get('chartStacked', false);
      const rolloverOn  = DB.get('rolloverEnabled', false);

      // Compute rollover surplus live from catAnalytics data — always accurate
      // For each category, walk months 1..month-1 accumulating surplus, result is
      // the carry into the selected month
      const getLiveRollover = (cat) => {
        if (!rolloverOn || !cat.monthlyBudget) return 0;
        let carry = 0;
        const viewYear = this.s.dashYear;
        const now = new Date();
        // Walk from January (or tracking start) up to the month before the selected one
        for (let m = 1; m < month; m++) {
          const spent   = cat.monthlyData[m] || 0;
          const surplus = (cat.monthlyBudget + carry) - spent;
          carry = surplus > 0 ? surplus : 0;
        }
        return carry;
      };

      // (catRows and pmSummaryHtml computed below after hiddenChartCats is resolved)

      // Chart uses plan-filtered cats (already in catAnalytics)
      // If no plan active, respect the per-chart hidden cats filter
      const hiddenChartCats = this.s.activePlanId ? new Set() : new Set(DB.get('chartHiddenCats', []));
      const activeCatsForChart = catAnalytics.filter(c =>
        Object.values(c.monthlyData).some(v=>v>0) && !hiddenChartCats.has(c.name));
      const allChartCats = catAnalytics.filter(c => Object.values(c.monthlyData).some(v=>v>0));

      // Filtered budget = sum of only visible categories' budgets (for dotted line + hero)
      const filteredMonthlyBudget = activeCatsForChart.reduce((s,c) => s + (c.monthlyBudget||0), 0);

      // Apply hidden filter to category rows and totals
      const visibleCatAnalytics = catAnalytics.filter(c => !hiddenChartCats.has(c.name));

      // Filtered month spend (only visible cats)
      const filteredMonthSpend = visibleCatAnalytics.reduce((s,c) => s+(c.monthlyData[month]||0), 0);

      // Filtered category rows
      const catRows = visibleCatAnalytics.map(cat => {
        const spent = cat.monthlyData[month]||0;
        const baseBudget = cat.monthlyBudget||0;
        const rolloverSurplus = getLiveRollover(cat);
        const budget = baseBudget + rolloverSurplus;

        if (spent===0 && budget===0) return '';
        const pct  = budget>0 ? Math.min((spent/budget)*100,100) : (spent>0?100:0);
        const over = budget>0 && spent>budget;
        const pctN = budget>0 ? Math.round((spent/budget)*100) : 0;
        const left = budget-spent;
        let badge = '';
        if (over)         badge=`<span class="badge badge-over">Over ${this._$(Math.abs(left))}</span>`;
        else if(pctN>=80) badge=`<span class="badge badge-warn">${pctN}%</span>`;
        else if(budget>0) badge=`<span class="badge badge-ok">${this._$(left)} left${rolloverSurplus>0?` <span style="color:var(--t3);font-size:10px;">(+${this._$(rolloverSurplus)} rollover)</span>`:''}</span>`;
        const emoji = this._catIcon(cat.name);
        return `<div class="cat-row" data-cat="${cat.name}" style="cursor:pointer;">
          <div class="cat-top">
            <span style="font-size:16px;line-height:1;">${emoji}</span>
            <span class="cat-name">${cat.name}</span>
            <span class="cat-spent" style="color:${over?'var(--red)':'var(--t1)'}">${this._$(spent)}</span>
          </div>
          <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${over?'var(--red)':cat.color}"></div></div>
          <div class="cat-meta"><span class="cat-sub-lbl">of ${this._$(budget)}/mo${rolloverSurplus>0?` <span style="font-size:10px;color:var(--t3);">(base ${this._$(baseBudget)})</span>`:''}</span>${badge}<span style="color:var(--t3);font-size:11px;margin-left:auto;">›</span></div>
        </div>`;
      }).join('');

      // Payment method summary — filtered to visible cats only
      const monthTxsVisible = this.txs().filter(t => {
        if (!t.date || !t.date.startsWith(`${this.s.dashYear}-${String(month).padStart(2,'0')}`)) return false;
        return !hiddenChartCats.has(t.category);
      });
      const pmTotals = {};
      monthTxsVisible.forEach(t => {
        if (!t.payment_method) return;
        pmTotals[t.payment_method] = (pmTotals[t.payment_method] || 0) + t.amount;
      });
      const pmMethods = this.paymentMethods();
      const pmEntries = Object.entries(pmTotals).sort((a,b)=>b[1]-a[1]);
      const pmMonthTotal = monthTxsVisible.reduce((s,t)=>s+t.amount, 0);
      const pmSummaryHtml = pmEntries.length ? `
        <div class="section-lbl">By Payment Method · ${this._monthFull(month)}</div>
        <div class="group">${pmEntries.map(([id, total]) => {
          const pm = pmMethods.find(p=>p.id===id) || {icon:'💳', name:id, color:'#8B8B8B'};
          const pct = pmMonthTotal > 0 ? Math.round((total / pmMonthTotal) * 100) : 0;
          return `<div class="cat-row">
            <div class="cat-top">
              <span style="font-size:16px;line-height:1;">${pm.icon}</span>
              <span class="cat-name">${pm.name}</span>
              <span class="cat-spent">${this._$(total)}</span>
            </div>
            <div class="prog-track"><div class="prog-fill" style="width:${pct}%;background:${pm.color}"></div></div>
            <div class="cat-meta"><span class="cat-sub-lbl">${pct}% of tagged spending</span></div>
          </div>`;
        }).join('')}</div>` : '';

      // Update hero with filtered spend if cats are hidden
      if (hiddenChartCats.size > 0) {
        const heroAmt = document.getElementById('hero-amt');
        if (heroAmt) heroAmt.textContent = this._$(filteredMonthSpend);
      }

      const filterLabel = hiddenChartCats.size
        ? `⚙︎ ${activeCatsForChart.length}/${allChartCats.length} categories`
        : '⚙︎ Filter categories';
      const filterActive = hiddenChartCats.size > 0;

      content.innerHTML = `
        <div style="display:flex;align-items:center;gap:8px;padding:8px 16px 4px;background:var(--surface2);border-radius:var(--r);margin:0 16px 8px;border:.5px solid var(--border);">
          <button id="chart-cat-filter-btn" style="flex:1;text-align:left;font-size:13px;padding:6px 0;background:none;border:none;cursor:pointer;color:${filterActive?'var(--orange)':'var(--t2)'};font-weight:${filterActive?700:500};">
            ${filterLabel}
          </button>
          ${filterActive ? `<span style="font-size:11px;color:var(--t3);">filters total spend, categories &amp; chart</span>` : ''}
          <button id="chart-mode-toggle" style="flex-shrink:0;font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(0,122,255,.1);color:var(--blue);font-weight:600;border:none;cursor:pointer;">${stackedMode?'📊 Simple':'🎨 Stacked'}</button>
        </div>
        <div class="group" style="margin-bottom:8px;"><div class="chart-wrap"><canvas id="monthly-chart"></canvas></div></div>
        <div class="section-lbl">Categories · ${this._monthFull(month)}${hiddenChartCats.size?` <span style="font-size:11px;color:var(--orange);font-weight:500;">(${hiddenChartCats.size} hidden)</span>`:''}</div>
        <div class="group">${catRows||'<div style="padding:20px;text-align:center;color:var(--t3);font-size:14px;">No charges this month</div>'}</div>
        ${pmSummaryHtml}
        <div style="height:8px;"></div>`;

      document.getElementById('chart-mode-toggle').onclick = () => {
        DB.set('chartStacked', !stackedMode);
        this._renderDashTab('monthly', data);
      };

      document.getElementById('chart-cat-filter-btn').onclick = (e) => {
        // Remove existing popover if open
        const existing = document.getElementById('chart-cat-popover');
        if (existing) { existing.remove(); return; }

        const pop = document.createElement('div');
        pop.id = 'chart-cat-popover';
        pop.style.cssText = `position:fixed;z-index:350;background:var(--surface);border:.5px solid var(--border2);border-radius:var(--r);box-shadow:0 4px 20px rgba(0,0,0,.15);padding:8px 0;min-width:200px;max-height:320px;overflow-y:auto;`;
        // Position below the button
        const btn = document.getElementById('chart-cat-filter-btn');
        const rect = btn.getBoundingClientRect();
        pop.style.top  = (rect.bottom + 6) + 'px';
        pop.style.right = (window.innerWidth - rect.right) + 'px';

        // All/None row
        pop.innerHTML = `<div style="display:flex;gap:0;border-bottom:.5px solid var(--border);margin-bottom:4px;">
          <button id="chart-filter-all" style="flex:1;padding:7px 14px;font-size:12px;font-weight:700;background:none;border:none;color:var(--blue);cursor:pointer;">All</button>
          <button id="chart-filter-none" style="flex:1;padding:7px 14px;font-size:12px;font-weight:700;background:none;border:none;color:var(--t2);cursor:pointer;">None</button>
        </div>` +
        allChartCats.map(cat => `
          <label style="display:flex;align-items:center;gap:10px;padding:8px 14px;cursor:pointer;">
            <input type="checkbox" data-cat="${cat.name}" ${hiddenChartCats.has(cat.name)?'':'checked'}
              style="width:16px;height:16px;accent-color:${cat.color};cursor:pointer;">
            <span style="font-size:14px;">${cat.emoji||'💳'}</span>
            <span style="font-size:13px;font-weight:500;flex:1;">${cat.name}</span>
            <span style="font-size:12px;color:var(--t2);">${this._$(Object.values(cat.monthlyData).reduce((s,v)=>s+v,0))}</span>
          </label>`).join('');

        document.body.appendChild(pop);

        const saveAndRefresh = () => {
          const hidden = [...pop.querySelectorAll('input[data-cat]:not(:checked)')].map(i=>i.dataset.cat);
          DB.set('chartHiddenCats', hidden);
          this._renderDashTab('monthly', data);
          pop.remove();
        };

        pop.querySelectorAll('input[data-cat]').forEach(cb => {
          cb.addEventListener('change', saveAndRefresh);
        });
        pop.querySelector('#chart-filter-all').onclick = () => {
          DB.set('chartHiddenCats', []); this._renderDashTab('monthly', data); pop.remove();
        };
        pop.querySelector('#chart-filter-none').onclick = () => {
          DB.set('chartHiddenCats', allChartCats.map(c=>c.name)); this._renderDashTab('monthly', data); pop.remove();
        };

        // Close when clicking outside
        setTimeout(() => {
          document.addEventListener('click', function handler(ev) {
            if (!pop.contains(ev.target) && ev.target.id !== 'chart-cat-filter-btn') {
              pop.remove(); document.removeEventListener('click', handler);
            }
          });
        }, 10);
      };

      // Tapping a category row shows that month's charges for that category
      document.querySelectorAll('.cat-row[data-cat]').forEach(row => {
        row.addEventListener('click', () => {
          this._openCatMonthSheet(row.dataset.cat, month, this.s.dashYear);
        });
      });

      setTimeout(() => {
        const ctx = document.getElementById('monthly-chart');
        if (!ctx) return;
        if (ctx._chart) ctx._chart.destroy();
        if (stackedMode) {
          ctx._chart = new Chart(ctx, {
            type:'bar',
            data:{
              labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
              datasets: [
                ...activeCatsForChart.map(cat => ({
                  label: cat.name,
                  data: Array.from({length:12},(_,i)=>cat.monthlyData[i+1]||0),
                  backgroundColor: cat.color,
                  borderRadius: 3,
                  borderSkipped: false,
                })),
                {
                  label: 'Budget',
                  data: Array(12).fill(filteredMonthlyBudget),
                  type: 'line',
                  borderColor: 'rgba(255,149,0,.65)',
                  borderWidth: 1.5,
                  borderDash: [4,3],
                  pointRadius: 0,
                  fill: false,
                  order: 0,
                }
              ]
            },
            options:{
              responsive:true, maintainAspectRatio:true,
              plugins:{
                legend:{display:false},
                tooltip:{
                  callbacks:{
                    label:c=>`${c.dataset.label}: ${this._$(c.parsed.y)}`,
                    footer: items => `Total: ${this._$(items.reduce((s,i)=>s+i.parsed.y,0))}`
                  }
                }
              },
              scales:{
                x:{stacked:true,grid:{display:false},ticks:{color:'#aeaeb2',font:{size:10}}},
                y:{stacked:true,grid:{color:'rgba(0,0,0,.04)'},ticks:{color:'#aeaeb2',font:{size:10},callback:v=>'$'+this._k(v)},beginAtZero:true}
              }
            }
          });
        } else {
          // Simple mode: filter monthSpends to only include visible cats
          const visibleMonthSpends = Array.from({length:12},(_,i) => {
            const m = i+1;
            return activeCatsForChart.reduce((s,c)=>s+(c.monthlyData[m]||0),0);
          });
          ctx._chart = new Chart(ctx, {
            type:'bar',
            data:{
              labels:['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
              datasets:[
                { label:'Spent', data:visibleMonthSpends,
                  backgroundColor:visibleMonthSpends.map((_,i)=>i+1===month?'rgba(0,122,255,1)':'rgba(0,122,255,0.22)'),
                  borderRadius:5, borderSkipped:false },
                { label:'Budget', data:Array(12).fill(filteredMonthlyBudget),
                  type:'line', borderColor:'rgba(255,149,0,.55)',
                  borderWidth:1.5, borderDash:[4,3], pointRadius:0, fill:false }
              ]
            },
            options:{
              responsive:true, maintainAspectRatio:true,
              plugins:{legend:{display:false},tooltip:{callbacks:{label:c=>this._$(c.parsed.y)}}},
              scales:{
                x:{grid:{display:false},ticks:{color:'#aeaeb2',font:{size:10}}},
                y:{grid:{color:'rgba(0,0,0,.04)'},ticks:{color:'#aeaeb2',font:{size:10},callback:v=>'$'+this._k(v)},beginAtZero:true}
              }
            }
          });
        }
      }, 30);
    } else {
      // ── Annual tab ────────────────────────────────────────────
      const now = new Date();
      const isCurrentYear = this.s.dashYear === now.getFullYear();
      const monthsElapsed = data.monthsElapsed;
      const monthsLeft = isCurrentYear ? Math.max(0, 12 - now.getMonth() - 1) : 0;
      // monthsLeft = months REMAINING after current month (don't count current month)

      // Overall summary numbers
      const totalYTD       = data.totalYTD;
      const annualBudget   = data.totalMonthlyBudget * 12;
      const projAnnual     = data.totalProjected;
      const avgPerMonth    = monthsElapsed > 0 ? totalYTD / monthsElapsed : 0;
      const budgetPerMonth = data.totalMonthlyBudget;
      // To stay on annual budget: how much left per remaining month?
      const remainingBudget      = annualBudget - totalYTD;
      const remainingPerMonth    = monthsLeft > 0 ? remainingBudget / monthsLeft : null;

      // Build per-category cards
      const catCards = catAnalytics.map(cat => {
        if (!cat.annualBudget && !cat.ytd) return '';
        const projOver   = cat.projectedAnnual > cat.annualBudget && cat.annualBudget > 0;
        const avgOver    = cat.avgMonthly > cat.monthlyBudget && cat.monthlyBudget > 0;
        const catRemBudget = cat.annualBudget - cat.ytd;
        const catRemPerMo  = monthsLeft > 0 ? catRemBudget / monthsLeft : null;
        const catRemOver   = catRemPerMo !== null && catRemPerMo < 0;
        const projPerMo    = isCurrentYear && monthsElapsed > 0 ? cat.projectedAnnual / 12 : null;

        let remBadge = '';
        if (catRemPerMo === null) {
          remBadge = '';
        } else if (catRemOver) {
          remBadge = `<span class="remaining-badge rb-red">Over annual budget</span>`;
        } else if (catRemPerMo < cat.monthlyBudget * 0.8) {
          remBadge = `<span class="remaining-badge rb-orange">${this._$(catRemPerMo)}/mo to stay on track</span>`;
        } else {
          remBadge = `<span class="remaining-badge rb-green">${this._$(catRemPerMo)}/mo to stay on track</span>`;
        }

        // Subcategory breakdown rows
        const subcatRows = cat.subcatBreakdown.filter(s => s.amount > 0).map(s => {
          const pct = cat.ytd > 0 ? Math.round((s.amount / cat.ytd) * 100) : 0;
          return `<div style="display:flex;align-items:center;gap:8px;padding:4px 0;">
            <div style="flex:1;min-width:0;">
              <div style="display:flex;justify-content:space-between;margin-bottom:3px;">
                <span style="font-size:12px;color:var(--t2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;">${s.name==='(none)'?'Uncategorized':s.name}</span>
                <span style="font-size:12px;font-weight:600;color:var(--t1);flex-shrink:0;margin-left:8px;">${this._$(s.amount)} <span style="color:var(--t3);font-weight:400;">${pct}%</span></span>
              </div>
              <div style="height:4px;background:var(--bg);border-radius:2px;overflow:hidden;">
                <div style="height:100%;width:${pct}%;background:${cat.color};border-radius:2px;"></div>
              </div>
            </div>
          </div>`;
        }).join('');

        return `<div class="ann-card" data-catcard="${cat.name}" style="cursor:pointer;">
          <div class="ann-card-hdr" onclick="this.closest('.ann-card').querySelector('.ann-card-body').classList.toggle('hidden')">
            <span style="font-size:18px;line-height:1;">${cat.emoji||'💳'}</span>
            <span class="ann-card-title">${cat.name}</span>
            ${remBadge}
            <span style="margin-left:auto;color:var(--t3);font-size:12px;flex-shrink:0;">▾</span>
          </div>
          <div class="ann-card-body">
            <div class="ann-row">
              <div class="ann-cell">
                <div class="ann-cell-lbl">Avg/mo actual</div>
                <div class="ann-cell-val" style="color:${avgOver?'var(--red)':'var(--t1)'}">${this._$(cat.avgMonthly)}</div>
              </div>
              <div class="ann-cell">
                <div class="ann-cell-lbl">Budget/mo</div>
                <div class="ann-cell-val c-muted">${this._$(cat.monthlyBudget)}</div>
              </div>
              <div class="ann-cell">
                <div class="ann-cell-lbl">Diff/mo</div>
                <div class="ann-cell-val" style="color:${avgOver?'var(--red)':'var(--green)'}">
                  ${avgOver?'+':''}${this._$(cat.avgMonthly - cat.monthlyBudget)}
                </div>
              </div>
            </div>
            <div class="ann-detail-row" style="padding-top:8px;">
              <span>YTD spent</span><span class="ann-detail-val">${this._$(cat.ytd)}</span>
            </div>
            <div class="ann-detail-row">
              <span>Projected annual${projPerMo!==null?` <span style="color:var(--t3);font-size:11px;">(${this._$(projPerMo)}/mo)</span>`:''}</span>
              <span class="ann-detail-val" style="color:${projOver?'var(--red)':'var(--green)'}">${this._$(cat.projectedAnnual)}</span>
            </div>
            <div class="ann-detail-row">
              <span>Annual budget</span><span class="ann-detail-val">${this._$(cat.annualBudget)}</span>
            </div>
            ${catRemPerMo !== null ? `<div class="ann-detail-row">
              <span>Rem. budget / mo left</span>
              <span class="ann-detail-val" style="color:${catRemOver?'var(--red)':catRemPerMo < cat.monthlyBudget*0.8?'var(--orange)':'var(--green)'}">
                ${catRemOver ? 'Over' : this._$(catRemPerMo)}
              </span>
            </div>` : ''}
            ${subcatRows ? `<div style="border-top:.5px solid var(--border);margin-top:8px;padding-top:8px;">
              <div style="font-size:11px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">By Subcategory · YTD</div>
              ${subcatRows}
            </div>` : ''}
          </div>
        </div>`;
      }).join('');

      // Chart: just Actual avg/mo vs Budget/mo — clean, no projected clutter
      const activeCats = catAnalytics.filter(c => c.annualBudget > 0 || c.ytd > 0);
      const chartLabels = activeCats.map(c => c.name.length > 8 ? c.name.slice(0,7)+'…' : c.name);

      content.innerHTML = `
        <div class="section-lbl">Avg Monthly: Actual vs Budget</div>
        <div style="margin:0 16px 10px;background:var(--surface);border-radius:var(--r);border:.5px solid var(--border);">
          <div style="display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;">
            <span style="font-size:12px;color:var(--t2);">Average per month by category</span>
            <div style="display:flex;gap:12px;align-items:center;">
              <span style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--t2);"><span style="width:8px;height:8px;border-radius:2px;background:rgba(0,0,0,.5);display:inline-block;"></span>Actual</span>
              <span style="display:flex;align-items:center;gap:4px;font-size:10px;color:var(--t2);"><span style="width:8px;height:8px;border-radius:2px;background:rgba(180,180,180,.7);display:inline-block;"></span>Budget</span>
            </div>
          </div>
          <div class="chart-wrap" style="padding:4px 10px 12px;"><canvas id="annual-compare-chart" style="max-height:220px;"></canvas></div>
        </div>

        <div class="section-lbl">Overall · ${this.s.dashYear}</div>
        <div style="margin:0 16px 10px;background:var(--surface);border-radius:var(--r);border:.5px solid var(--border);">
          <div class="ann-row">
            <div class="ann-cell">
              <div class="ann-cell-lbl">Avg/mo actual</div>
              <div class="ann-cell-val" style="color:${avgPerMonth>budgetPerMonth?'var(--red)':'var(--t1)'}">${this._$(avgPerMonth)}</div>
            </div>
            <div class="ann-cell">
              <div class="ann-cell-lbl">Budget/mo</div>
              <div class="ann-cell-val c-muted">${this._$(budgetPerMonth)}</div>
            </div>
            <div class="ann-cell">
              <div class="ann-cell-lbl">Rem/mo to budget</div>
              <div class="ann-cell-val" style="color:${remainingPerMonth!==null&&remainingPerMonth<0?'var(--red)':remainingPerMonth!==null&&remainingPerMonth<budgetPerMonth*0.8?'var(--orange)':'var(--green)'}">
                ${remainingPerMonth===null?'—':remainingPerMonth<0?'Over':this._$(remainingPerMonth)}
              </div>
            </div>
          </div>
          <div class="ann-detail-row" style="padding-top:8px;">
            <span>YTD total</span><span class="ann-detail-val">${this._$(totalYTD)}</span>
          </div>
          <div class="ann-detail-row">
            <span>Projected year-end${isCurrentYear&&monthsElapsed>0?` <span style="font-size:11px;color:var(--t3);">(${this._$(avgPerMonth)}/mo)</span>`:''}</span>
            <span class="ann-detail-val" style="color:${projAnnual>annualBudget?'var(--red)':'var(--green)'}">${this._$(projAnnual)}</span>
          </div>
          <div class="ann-detail-row">
            <span>Annual budget</span><span class="ann-detail-val">${this._$(annualBudget)}</span>
          </div>
          ${isCurrentYear && monthsLeft > 0 ? `<div class="ann-detail-row">
            <span>Months remaining</span><span class="ann-detail-val">${monthsLeft}</span>
          </div>` : ''}
        </div>

        <div class="section-lbl">By Category <span style="font-size:11px;color:var(--t3);font-weight:400;">tap to expand · subcategory breakdown inside</span></div>
        ${catCards}
        <div style="height:8px;"></div>`;

      // Chart: Actual avg/mo (category color) vs Budget/mo (grey) — clean two-dataset view
      setTimeout(() => {
        const ctx = document.getElementById('annual-compare-chart');
        if (!ctx || !activeCats.length) return;
        new Chart(ctx, {
          type: 'bar',
          data: {
            labels: chartLabels,
            datasets: [
              {
                label: 'Actual avg/mo',
                data: activeCats.map(c => c.avgMonthly),
                backgroundColor: activeCats.map(c => c.color + 'dd'),
                borderRadius: 4, borderSkipped: false,
              },
              {
                label: 'Budget/mo',
                data: activeCats.map(c => c.monthlyBudget),
                backgroundColor: 'rgba(180,180,180,0.4)',
                borderRadius: 4, borderSkipped: false,
              },
            ]
          },
          options: {
            responsive: true, maintainAspectRatio: true,
            plugins: {
              legend: { display: false },
              tooltip: {
                callbacks: {
                  label: c => `${c.dataset.label}: ${this._$(c.parsed.y)}`,
                  afterBody: items => {
                    const cat = activeCats[items[0].dataIndex];
                    if (!cat) return '';
                    const diff = cat.avgMonthly - cat.monthlyBudget;
                    return diff > 0 ? `Over by ${this._$(diff)}/mo` : diff < 0 ? `Under by ${this._$(Math.abs(diff))}/mo` : '';
                  }
                }
              }
            },
            scales: {
              x: {
                grid: { display: false },
                ticks: { color: '#aeaeb2', font: { size: 9 }, maxRotation: 35, minRotation: 25 }
              },
              y: {
                grid: { color: 'rgba(0,0,0,.04)' },
                ticks: { color: '#aeaeb2', font: { size: 10 }, callback: v => '$'+this._k(v) },
                beginAtZero: true
              }
            }
          }
        });
      }, 30);
    }
  },

  // ── Transactions ─────────────────────────────────────────────
  _buildTransactions() {
    let txs = this.txs().filter(t => t.date && t.date.startsWith(String(this.s.txYear)));
    txs.sort((a,b) => new Date(b.date)-new Date(a.date));
    const allCats  = ['all', ...new Set(txs.map(t=>t.category).filter(Boolean))];
    const plans    = this.budgetPlans();
    const curPlan  = this.s.txPlanFilter;

    const planChips = plans.length ? `
      <div class="chips" id="plan-chips" style="border-bottom:.5px solid var(--border);padding-bottom:6px;">
        <button class="chip ${!curPlan?'active':''}" data-pid="">All Budgets</button>
        ${plans.map(p=>`<button class="chip ${curPlan===p.id?'active':''}" data-pid="${p.id}"
          style="${curPlan===p.id?`background:${p.color};color:#fff;border-color:${p.color};`:''}">${p.icon} ${p.name}</button>`).join('')}
      </div>` : '';

    const main = document.getElementById('main');
    main.innerHTML = `<div class="view">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 16px 0;">
        <div class="view-title" style="padding:0;">Charges</div>
        <button class="yr-pill" id="tx-yr-btn">${this.s.txYear} ▾</button>
      </div>
      <div class="search-wrap">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input class="search-inp" id="tx-search" type="search" placeholder="Search payee, category, note, $amount…" value="${this.s.txSearch}">
      </div>
      ${planChips}
      <div class="chips" id="chips">
        ${allCats.map(c=>`<button class="chip ${c===this.s.txFilter?'active':''}" data-cat="${c}">${c==='all'?'All':c}</button>`).join('')}
      </div>
      <div class="chips" id="subcat-chips" style="${this.s.txFilter !== 'all' ? '' : 'display:none'}">
        ${this.s.txFilter !== 'all' ? (() => {
          const cat = this.cats().find(c => c.name === this.s.txFilter);
          const subs = cat?.subcategories || [];
          if (!subs.length) return '';
          return `<button class="chip ${!this.s.txSubFilter ? 'active' : ''}" data-sub="">All ${this.s.txFilter}</button>` +
            subs.map(s => `<button class="chip ${s === this.s.txSubFilter ? 'active' : ''}" data-sub="${s}">${s}</button>`).join('');
        })() : ''}
      </div>
      <div id="tx-list"></div>
    </div>`;

    document.getElementById('tx-yr-btn').onclick = () => this._openYearPicker('tx');
    document.getElementById('tx-search').addEventListener('input', e => {
      this.s.txSearch = e.target.value; this._renderTxList();
    });

    // Plan filter chips
    document.querySelectorAll('#plan-chips .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        this.s.txPlanFilter = btn.dataset.pid || null;
        document.querySelectorAll('#plan-chips .chip').forEach(b => {
          b.classList.remove('active');
          b.style.background = ''; b.style.color = ''; b.style.borderColor = '';
        });
        btn.classList.add('active');
        if (this.s.txPlanFilter) {
          const p = plans.find(pl=>pl.id===this.s.txPlanFilter);
          if (p) { btn.style.background=p.color; btn.style.color='#fff'; btn.style.borderColor=p.color; }
        }
        this._renderTxList();
      });
    });    document.querySelectorAll('#chips .chip').forEach(btn => {
      btn.addEventListener('click', () => {
        this.s.txFilter = btn.dataset.cat;
        this.s.txSubFilter = ''; // reset subcategory filter on category change
        document.querySelectorAll('#chips .chip').forEach(b=>b.classList.remove('active'));
        btn.classList.add('active');
        // Show/hide subcategory chips
        const subWrap = document.getElementById('subcat-chips');
        if (subWrap) {
          if (this.s.txFilter !== 'all') {
            const cat = this.cats().find(c => c.name === this.s.txFilter);
            const subs = cat?.subcategories || [];
            if (subs.length) {
              subWrap.style.display = '';
              subWrap.innerHTML = `<button class="chip active" data-sub="">All ${this.s.txFilter}</button>` +
                subs.map(s => `<button class="chip" data-sub="${s}">${s}</button>`).join('');
              subWrap.querySelectorAll('.chip').forEach(sb => {
                sb.addEventListener('click', () => {
                  this.s.txSubFilter = sb.dataset.sub;
                  subWrap.querySelectorAll('.chip').forEach(b=>b.classList.remove('active'));
                  sb.classList.add('active');
                  this._renderTxList();
                });
              });
            } else {
              subWrap.style.display = 'none';
              subWrap.innerHTML = '';
            }
          } else {
            subWrap.style.display = 'none';
            subWrap.innerHTML = '';
          }
        }
        this._renderTxList();
      });
    });
    this._renderTxList();
  },

  _renderTxList() {
    let txs = this.txs().filter(t => t.date && t.date.startsWith(String(this.s.txYear)));
    if (this.s.txFilter !== 'all')  txs = txs.filter(t => t.category === this.s.txFilter);
    if (this.s.txSubFilter)         txs = txs.filter(t => t.subcategory === this.s.txSubFilter);
    // Plan filter: match on budget_ids or fall back to default plan for legacy charges
    if (this.s.txPlanFilter) {
      txs = txs.filter(t => {
        if (t.budget_ids?.length) return t.budget_ids.includes(this.s.txPlanFilter);
        // Legacy: treat as belonging to default plan
        return DB.get('defaultBudgetPlanId','') === this.s.txPlanFilter;
      });
    }
    if (this.s.txSearch) {
      const q = this.s.txSearch.trim().toLowerCase();
      // Amount/price search: supports "$45", "45", ">50", "<100", "=45.99"
      const amtMatch = q.match(/^([><=]?)?\$?([\d.]+)$/);
      if (amtMatch) {
        const op  = amtMatch[1] || '=';
        const val = parseFloat(amtMatch[2]);
        txs = txs.filter(t => {
          const abs = Math.abs(t.amount);
          if (op === '>')  return abs >  val;
          if (op === '<')  return abs <  val;
          if (op === '>=') return abs >= val;
          if (op === '<=') return abs <= val;
          // exact or partial — match if amount starts with the digits typed
          return abs.toFixed(2).startsWith(amtMatch[2]) || abs === val;
        });
      } else {
        txs = txs.filter(t =>
          (t.payee||'').toLowerCase().includes(q) ||
          (t.category||'').toLowerCase().includes(q) ||
          (t.subcategory||'').toLowerCase().includes(q) ||
          (t.note||'').toLowerCase().includes(q)
        );
      }
    }
    txs.sort((a,b)=>new Date(b.date)-new Date(a.date));

    const container = document.getElementById('tx-list');
    if (!txs.length) {
      container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔍</div><div class="empty-title">No charges found</div><div class="empty-sub">Try a different filter.</div></div>`;
      return;
    }

    const groups = {};
    txs.forEach(t => { if(!groups[t.date])groups[t.date]=[]; groups[t.date].push(t); });
    const dates = Object.keys(groups).sort((a,b)=>new Date(b)-new Date(a));

    let html = '';
    dates.forEach(d => {
      const dayTotal = groups[d].reduce((s,t)=>s+t.amount,0);
      html += `<div class="date-grp-lbl"><span>${this._dateLabel(d)}</span><span>${this._$(dayTotal)}</span></div><div class="group" style="margin-bottom:4px;">`;
      groups[d].forEach(tx => {
        const cat = this.cats().find(c=>c.name===tx.category);
        const color = cat ? cat.color : '#8B8B8B';
        const icon = this._catIcon(tx.category);
        const subline = [tx.subcategory, tx.note].filter(Boolean).join(' · ');
        const recurBadge  = tx.recurring_id ? `<span class="recur-badge">🔁 Auto</span>` : '';
        const splitBadge  = tx.split_group  ? `<span class="recur-badge" style="background:rgba(88,86,214,.1);color:var(--indigo);">✂️ Split</span>` : '';
        const creditBadge = tx.amount < 0   ? `<span class="recur-badge" style="background:rgba(52,199,89,.1);color:var(--green);">↩️ Credit</span>` : '';
        const pm = tx.payment_method ? this.paymentMethods().find(p=>p.id===tx.payment_method) : null;
        const pmBadge = pm ? `<span class="recur-badge" style="background:rgba(0,0,0,.05);color:var(--t2);">${pm.icon}</span>` : '';
        // Show budget plan badge only when not filtered to a specific plan
        const txPlanList = !this.s.txPlanFilter ? this._txPlans(tx) : [];
        const planBadge = txPlanList.map(p =>
          `<span class="recur-badge" style="background:${p.color}18;color:${p.color};">${p.icon}</span>`
        ).join('');
        html += `<div class="tx-swipe-wrap" data-id="${tx.id}">
          <div class="tx-swipe-del"><span style="font-size:20px;">🗑</span><span>Delete</span></div>
          <div class="tx-swipe-inner tx-item" data-id="${tx.id}">
            <div class="tx-icon" style="background:${color}18;font-size:17px;">${icon}</div>
            <div class="tx-info">
              <div class="tx-title">${tx.payee||tx.category}${recurBadge}${splitBadge}${creditBadge}${pmBadge}${planBadge}</div>
              <div class="tx-sub">${tx.payee?tx.category+(subline?' · '+subline:''):subline||'—'}</div>
            </div>
            <div class="tx-right"><div class="tx-amt" style="${tx.amount<0?'color:var(--green);':''}">${tx.amount<0?'−':''}${this._$(Math.abs(tx.amount))}</div></div>
          </div>
        </div>`;
      });
      html += '</div>';
    });
    container.innerHTML = html + '<div style="height:8px;"></div>';

    // Bind tap to open
    container.querySelectorAll('.tx-swipe-inner').forEach(el => {
      el.addEventListener('click', () => {
        const tx = this.txs().find(t=>t.id===el.dataset.id);
        if (tx) this._openTxSheet(tx, false);
      });
    });

    // Bind swipe-to-delete
    container.querySelectorAll('.tx-swipe-wrap').forEach(wrap => {
      const inner = wrap.querySelector('.tx-swipe-inner');
      const delBtn = wrap.querySelector('.tx-swipe-del');
      let startX = 0, dx = 0, swiped = false;

      const onStart = e => {
        startX = (e.touches?.[0]||e).clientX;
        dx = 0;
      };
      const onMove = e => {
        dx = (e.touches?.[0]||e).clientX - startX;
        if (dx < -10 && dx > -100) {
          inner.style.transition = 'none';
          inner.style.transform = `translateX(${dx}px)`;
          delBtn.style.transition = 'none';
          delBtn.style.transform = `translateX(${100+dx}%)`;
          e.preventDefault();
        }
      };
      const onEnd = () => {
        inner.style.transition = '';
        delBtn.style.transition = '';
        if (dx < -50) {
          inner.style.transform = 'translateX(-80px)';
          delBtn.style.transform = 'translateX(0)';
          swiped = true;
        } else {
          inner.style.transform = '';
          delBtn.style.transform = '';
          swiped = false;
        }
      };

      wrap.addEventListener('touchstart', onStart, {passive:true});
      wrap.addEventListener('touchmove',  onMove,  {passive:false});
      wrap.addEventListener('touchend',   onEnd);

      delBtn.addEventListener('click', () => {
        const id = wrap.dataset.id;
        this.deleteTx(id);
        wrap.style.transition = 'opacity .2s';
        wrap.style.opacity = '0';
        setTimeout(() => this._renderTxList(), 220);
        this.toast('Charge deleted');
      });
    });
  },

  // ── Calendar ─────────────────────────────────────────────────
  _buildCalendar() {
    const y = this.s.calYear, m = this.s.calMonth;
    const txs = this.txs().filter(t => t.date && t.date.startsWith(`${y}-${String(m).padStart(2,'0')}`));
    const byDay = {};
    txs.forEach(t => {
      const d = parseInt(t.date.split('-')[2]);
      if(!byDay[d]) byDay[d]={total:0,txs:[]};
      byDay[d].total += t.amount;
      byDay[d].txs.push(t);
    });

    const daysInMonth = new Date(y,m,0).getDate();
    const firstDay    = new Date(y,m-1,1).getDay();
    const today       = new Date();
    const monthTotal  = txs.reduce((s,t)=>s+t.amount,0);
    const showCatDots = DB.get('calCatDots', false);

    let cells = '';
    for(let i=0;i<firstDay;i++) cells+='<div class="cal-day empty"></div>';
    for(let d=1;d<=daysInMonth;d++){
      const isToday = today.getFullYear()===y&&today.getMonth()+1===m&&today.getDate()===d;
      const isSel   = this.s.selCalDay===d;
      const data    = byDay[d];

      // Build category dots for this day
      let catDotsHtml = '';
      if (showCatDots && data) {
        const catColors = [...new Map(data.txs.map(t => {
          const cat = this.cats().find(c=>c.name===t.category);
          return [t.category, cat?.color||'#8B8B8B'];
        }))].slice(0,5); // max 5 dots
        catDotsHtml = `<div class="cal-cat-dots">${catColors.map(([,c])=>`<div class="cal-cat-dot" style="background:${c}"></div>`).join('')}</div>`;
      }

      cells+=`<div class="cal-day ${isToday?'today':''} ${isSel?'sel':''}" data-day="${d}" style="pointer-events:auto;cursor:pointer;">
        <div class="day-num" style="pointer-events:none;">${d}</div>
        ${data ? `<div class="day-amt" style="pointer-events:none;">$${Math.round(data.total)}</div>` : ''}
        ${showCatDots ? catDotsHtml : (data ? '<div class="day-dot" style="pointer-events:none;"></div>' : '')}
      </div>`;
    }

    const main = document.getElementById('main');
    main.innerHTML = `<div class="view">
      <div style="display:flex;align-items:center;justify-content:space-between;padding:20px 16px 0;">
        <div class="view-title" style="padding:0;">Calendar</div>
        <button class="yr-pill" id="cal-yr-btn">${y} ▾</button>
      </div>
      <div class="month-nav" style="padding-top:12px;">
        <button class="mnav-btn" id="cal-prev">‹</button>
        <div class="mnav-lbl">${this._monthFull(m)} ${y}</div>
        <button class="mnav-btn" id="cal-next">›</button>
        ${(m !== new Date().getMonth()+1 || y !== new Date().getFullYear()) ? `<button class="yr-pill" id="cal-today-btn" style="font-size:12px;padding:4px 10px;">Today</button>` : ''}
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;padding:8px 16px 4px;">
        <div style="font-weight:700;color:var(--blue);">${this._$(monthTotal)}</div>
        <button id="cal-dots-toggle" class="cal-toggle-btn ${showCatDots?'on':''}">
          <span>${showCatDots?'🎨':'⚪'}</span>
          <span>${showCatDots?'Category colors':'Show categories'}</span>
        </button>
      </div>
      <div class="cal-dows">${['Su','Mo','Tu','We','Th','Fr','Sa'].map(d=>`<div class="cal-dow">${d}</div>`).join('')}</div>
      <div class="cal-grid" id="cal-grid">${cells}</div>
      <div id="cal-detail"></div>
      <div style="height:8px;"></div>
    </div>`;

    document.getElementById('cal-yr-btn').onclick = () => this._openYearPicker('cal');
    document.getElementById('cal-dots-toggle').onclick = () => {
      DB.set('calCatDots', !showCatDots);
      this._buildCalendar();
      if (this.s.selCalDay) this._renderCalDetail(this.s.selCalDay, byDay);
    };
    const calTodayBtn = document.getElementById('cal-today-btn');
    if (calTodayBtn) calTodayBtn.onclick = () => {
      const n = new Date();
      this.s.calMonth = n.getMonth()+1;
      this.s.calYear  = n.getFullYear();
      this.s.selCalDay = null;
      this._buildCalendar();
    };
    document.getElementById('cal-prev').onclick = () => {
      let nm=this.s.calMonth-1,ny=this.s.calYear;
      if(nm<1){nm=12;ny--;} this.s.calMonth=nm;this.s.calYear=ny;this.s.selCalDay=null;this._buildCalendar();
    };
    document.getElementById('cal-next').onclick = () => {
      let nm=this.s.calMonth+1,ny=this.s.calYear;
      if(nm>12){nm=1;ny++;} this.s.calMonth=nm;this.s.calYear=ny;this.s.selCalDay=null;this._buildCalendar();
    };

    // Use event delegation on the grid — fixes desktop click-through on child elements
    document.getElementById('cal-grid').addEventListener('click', e => {
      const cell = e.target.closest('.cal-day[data-day]');
      if (!cell) return;
      const day = parseInt(cell.dataset.day);
      this.s.selCalDay = day;
      document.querySelectorAll('.cal-day').forEach(d=>d.classList.remove('sel'));
      cell.classList.add('sel');
      this._renderCalDetail(day, byDay);
      // Scroll to detail on mobile
      setTimeout(()=>{ const det=document.getElementById('cal-detail'); if(det) det.scrollIntoView({behavior:'smooth',block:'nearest'}); }, 50);
    });

    if (this.s.selCalDay) this._renderCalDetail(this.s.selCalDay, byDay);
  },

  _renderCalDetail(day, byDay) {
    const data = byDay[day];
    const det  = document.getElementById('cal-detail');
    const y=this.s.calYear,m=this.s.calMonth;
    const dateStr = `${y}-${String(m).padStart(2,'0')}-${String(day).padStart(2,'0')}`;
    const label = `${this._monthFull(m)} ${day}`;

    if (!data||!data.txs.length) {
      det.innerHTML=`<div class="cal-detail">
        <div class="cal-detail-hdr"><span style="font-size:15px;font-weight:600;">${label}</span><span style="color:var(--t3);font-size:13px;">No charges</span></div>
        <div style="padding:10px 14px;"><button class="btn-full" id="cal-add-btn" style="margin-top:0;">+ Log charge for this day</button></div>
      </div>`;
      document.getElementById('cal-add-btn').onclick=()=>this._openTxSheet({date:dateStr},true);
      return;
    }

    const rows = data.txs.map(tx=>{
      const cat=this.cats().find(c=>c.name===tx.category);
      const color=cat?cat.color:'#8B8B8B';
      const subline=[tx.subcategory,tx.note].filter(Boolean).join(' · ');
      return `<div class="tx-item" data-id="${tx.id}">
        <div class="tx-icon" style="background:${color}18;font-size:17px;">${this._catIcon(tx.category)}</div>
        <div class="tx-info"><div class="tx-title">${tx.payee||tx.category}</div><div class="tx-sub">${tx.payee?tx.category+(subline?' · '+subline:''):subline||'—'}</div></div>
        <div class="tx-right"><div class="tx-amt">${this._$(tx.amount)}</div></div>
      </div>`;
    }).join('');

    det.innerHTML=`<div class="cal-detail">
      <div class="cal-detail-hdr">
        <span style="font-size:15px;font-weight:600;">${label}</span>
        <span style="font-weight:700;color:var(--blue);">${this._$(data.total)}</span>
      </div>
      ${rows}
      <div style="padding:10px 14px 4px;"><button class="btn-full" id="cal-add-btn" style="margin-top:0;">+ Add another charge</button></div>
    </div>`;

    det.querySelectorAll('.tx-item').forEach(el=>{
      el.addEventListener('click',()=>{
        const tx=this.txs().find(t=>t.id===el.dataset.id);
        if(tx) this._openTxSheet(tx,false);
      });
    });
    document.getElementById('cal-add-btn').onclick=()=>this._openTxSheet({date:dateStr},true);
  },

        <div class="set-item" id="s-recur"><div class="set-icon" style="background:var(--indigo);">🔁</div><div style="flex:1;"><div class="set-name">Recurring Charges</div><div style="font-size:12px;color:var(--t2);">${this.recurring().filter(r=>r.active).length} active</div></div><span style="color:var(--t3);font-size:12px;">›</span></div>

          <div id="rollover-toggle" style="width:44px;height:26px;border-radius:13px;background:${DB.get('rolloverEnabled',false)?'var(--green)':'rgba(120,120,128,.2)'};position:relative;transition:background .2s;flex-shrink:0;">

      <div class="section-lbl">Sync &amp; Backup</div>

  // ── Import / Export ──────────────────────────────────────────
  _exportCSV() {
    const txs = this.txs();
    if (!txs.length) { this.toast('No charges to export',''); return; }
    const header = 'Date,Amount,Category,Subcategory,Payee,Note';
    const rows = txs
      .sort((a,b)=>new Date(a.date)-new Date(b.date))
      .map(t => [t.date, t.amount, t.category, t.subcategory||'', t.payee||'', t.note||''].map(v=>`"${String(v).replace(/"/g,'""')}"`).join(','));
    const csv = [header, ...rows].join('\n');
    this._download('spendly_export.csv', 'text/csv', csv);
    DB.set('lastBackup', new Date().toISOString());
    this.toast('CSV exported! ✓ Backup recorded');
  },

  _exportXLSX() {
    if (!window.XLSX) { this.toast('XLSX library not loaded',''); return; }
    const txs = this.txs().sort((a,b)=>new Date(a.date)-new Date(b.date));
    if (!txs.length) { this.toast('No charges to export',''); return; }

    const wb = XLSX.utils.book_new();

    // Transactions sheet
    const txData = [['Date','Amount','Category','Subcategory','Payee','Note'],
      ...txs.map(t=>[t.date, t.amount, t.category, t.subcategory||'', t.payee||'', t.note||''])];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(txData), 'Transactions');

    // Summary sheet
    const data = this._analytics(new Date().getFullYear());
    const sumData = [['Category','YTD Spent','Monthly Budget','Annual Budget','Projected Annual'],
      ...data.catAnalytics.map(c=>[c.name, c.ytd, c.monthlyBudget, c.annualBudget, c.projectedAnnual])];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(sumData), 'Summary');

    // Monthly sheet
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    const mData  = [['Category',...months,'Total'],
      ...data.catAnalytics.map(c=>[c.name,...Array.from({length:12},(_,i)=>c.monthlyData[i+1]||0),c.ytd])];
    XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(mData), 'Monthly Breakdown');

    XLSX.writeFile(wb, `spendly_${new Date().getFullYear()}.xlsx`);
    DB.set('lastBackup', new Date().toISOString());
    this.toast('XLSX exported! ✓ Backup recorded');
  },

  // Normalize any date string to YYYY-MM-DD
  _normalizeDate(raw) {
    if (!raw) return '';
    const s = raw.replace(/"/g,'').trim();
    // Already YYYY-MM-DD
    if (/^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
    // M/D/YYYY or MM/DD/YYYY
    if (/^\d{1,2}\/\d{1,2}\/\d{4}$/.test(s)) {
      const [m,d,y] = s.split('/');
      return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
    }
    // M-D-YYYY or MM-DD-YYYY
    if (/^\d{1,2}-\d{1,2}-\d{4}$/.test(s)) {
      const [m,d,y] = s.split('-');
      return `${y}-${m.padStart(2,'0')}-${d.padStart(2,'0')}`;
    }
    // YYYY/MM/DD
    if (/^\d{4}\/\d{2}\/\d{2}$/.test(s)) return s.replace(/\//g,'-');
    // Try native Date parse as last resort
    const parsed = new Date(s);
    if (!isNaN(parsed.getTime())) {
      return `${parsed.getFullYear()}-${String(parsed.getMonth()+1).padStart(2,'0')}-${String(parsed.getDate()).padStart(2,'0')}`;
    }
    return s; // return as-is if we can't parse
  },

  _importCSV(file) {
    if (!file) return;
    const reader = new FileReader();
    reader.onload = e => {
      try {
        const lines = e.target.result.trim().split('\n');
        const header = lines[0].toLowerCase();
        if (!header.includes('date')||!header.includes('amount')) {
          this.toast('Invalid CSV format','error'); return;
        }
        const cols = lines[0].split(',').map(c=>c.replace(/"/g,'').trim().toLowerCase());
        const iDate=cols.indexOf('date'), iAmt=cols.indexOf('amount'),
              iCat=cols.indexOf('category'), iSub=cols.indexOf('subcategory'),
              iPay=cols.indexOf('payee'), iNote=cols.indexOf('note');
        let imported = 0, skipped = 0, badDate = 0;
        const txs = this.txs();
        const existing = new Set(txs.map(t=>`${t.date}|${t.amount}|${t.category}|${t.payee}`));
        lines.slice(1).forEach(line => {
          if (!line.trim()) return;
          const parts = this._parseCSVLine(line);
          const rawDate = parts[iDate]?.replace(/"/g,'').trim();
          const date = this._normalizeDate(rawDate);
          const amount = parseFloat(parts[iAmt]);
          if (!date||isNaN(amount)) { skipped++; return; }
          if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { badDate++; }
          const category = iCat>=0 ? parts[iCat]?.replace(/"/g,'').trim() : '';
          const subcategory = iSub>=0 ? parts[iSub]?.replace(/"/g,'').trim() : '';
          const payee = iPay>=0 ? parts[iPay]?.replace(/"/g,'').trim() : '';
          const note  = iNote>=0 ? parts[iNote]?.replace(/"/g,'').trim() : '';
          const key = `${date}|${amount}|${category}|${payee}`;
          if (existing.has(key)) { skipped++; return; }
          txs.push({ id:crypto.randomUUID(), date, amount, category, subcategory, payee, note, createdAt:new Date().toISOString() });
          existing.add(key); imported++;
        });
        this.saveTxs(txs);
        let msg = `Imported ${imported} charges`;
        if (skipped) msg += ` (${skipped} skipped)`;
        if (badDate) msg += ` ⚠ ${badDate} dates may need review`;
        this.toast(msg);
        this.renderView('transactions');
      } catch(err) {
        this.toast('Import error: '+err.message, 'error');
        console.error(err);
      }
    };
    reader.readAsText(file);
    document.getElementById('csv-file-input').value='';
  },

  // Fix already-imported transactions with bad date formats
  _repairDates() {
    const txs = this.txs();
    let fixed = 0;
    const repaired = txs.map(t => {
      const normalized = this._normalizeDate(t.date);
      if (normalized !== t.date) { fixed++; return {...t, date: normalized}; }
      return t;
    });
    if (fixed > 0) {
      this.saveTxs(repaired);
      this.toast(`Fixed ${fixed} date format${fixed>1?'s':''}!`);
      this._refreshView();
    } else {
      this.toast('All dates look good already');
    }
    return fixed;
  },

  _parseCSVLine(line) {
    const result=[];let cur='';let inQ=false;
    for(let i=0;i<line.length;i++){
      if(line[i]==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
      else if(line[i]===','&&!inQ){result.push(cur);cur='';}
      else cur+=line[i];
    }
    result.push(cur);
    return result;
  },

  _showCSVFormat() {
    const ov = this._overlay(`
      <div class="sheet-handle"></div>
      <div class="sheet-hdr"><span class="sheet-title">CSV Format</span><button class="sheet-close" id="fmt-x">✕</button></div>
      <div class="sheet-body">
        <p style="font-size:14px;color:var(--t2);margin-bottom:12px;">Your CSV must have a header row with these columns:</p>
        <div class="group" style="margin:0 0 12px;">
          ${['Date (YYYY-MM-DD)','Amount (number)','Category','Subcategory','Payee','Note'].map(c=>`<div class="grow"><span class="grow-label" style="font-size:14px;">${c}</span></div>`).join('')}
        </div>
        <p style="font-size:13px;color:var(--t3);">Date and Amount are required. All others are optional. Duplicate rows (same date+amount+category+payee) are skipped automatically.</p>
        <p style="font-size:13px;color:var(--t3);margin-top:8px;">Export a CSV first to see the exact format Spendly expects.</p>
        <div style="height:8px;"></div>
      </div>`);
    ov.querySelector('#fmt-x').onclick=()=>ov.remove();

  _download(filename, mime, content) {
    const blob = new Blob([content], {type:mime});
    const url  = URL.createObjectURL(blob);
    const a    = document.createElement('a');
    a.href=url; a.download=filename; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  },

    if (hasGist) {
      const status = s => { const el = document.getElementById('gh-op-status'); if(el) el.innerHTML = s; };
      document.getElementById('gh-sync-now').onclick = async () => {
        status('⏳ Syncing…');
        try { await GH.sync(); this.renderView(this.s.view); this._buildGitHubSetup(); }
        catch(e) { status(`❌ ${e.message}`); }
      };
      document.getElementById('gh-pull').onclick = async () => {
        if (!confirm('This will overwrite your local data with GitHub data. Continue?')) return;
        status('⏳ Pulling…');
        try { await GH.pull(); this.renderView(this.s.view); this._buildGitHubSetup(); this.toast('Pulled from GitHub ✓'); }
        catch(e) { status(`❌ ${e.message}`); }
      };
      document.getElementById('gh-push').onclick = async () => {
        status('⏳ Pushing…');
        try { await GH.push(); status('✅ Pushed successfully!'); this.toast('Pushed to GitHub ✓'); }
        catch(e) { status(`❌ ${e.message}`); }
      };
      document.getElementById('gh-disconnect').onclick = () => {
        if (!confirm('Disconnect GitHub? Your local data will remain untouched.')) return;
        DB.set('gh_token', null); DB.set('gh_gist_id', null);
        this._updateSyncDot();
        this._buildGitHubSetup();
        this.toast('GitHub disconnected');
      };
    } else {
      const statusEl = id => document.getElementById(id);
      document.getElementById('gh-connect-btn').onclick = async () => {
        const token = document.getElementById('gh-token-inp').value.trim();
        if (!token) { this.toast('Paste your token first', 'error'); return; }
        statusEl('gh-validate-status').textContent = '⏳ Validating token…';
        try {
          const login = await GH.validateToken(token);
          statusEl('gh-validate-status').innerHTML = `✅ Logged in as <strong>@${login}</strong> — creating Gist…`;
          DB.set('gh_token', token);
          const existingGist = document.getElementById('gh-gist-inp')?.value.trim();
          if (existingGist) {
            DB.set('gh_gist_id', existingGist);
            await GH.pull();
            this.renderView(this.s.view);
          } else {
            await GH.createGist(token);
          }
          this._updateSyncDot();
          this._buildGitHubSetup();
          this.toast('GitHub connected! 🎉');
        } catch(e) {
          DB.set('gh_token', null);
          statusEl('gh-validate-status').innerHTML = `❌ ${e.message}`;
        }
      };
      document.getElementById('gh-link-btn').onclick = async () => {
        const token  = document.getElementById('gh-token-inp').value.trim();
        const gistId = document.getElementById('gh-gist-inp').value.trim();
        if (!token)  { this.toast('Paste your token first', 'error'); return; }
        if (!gistId) { this.toast('Paste a Gist ID first', 'error'); return; }
        document.getElementById('gh-validate-status').textContent = '⏳ Connecting…';
        try {
          await GH.validateToken(token);
          DB.set('gh_token', token);
          DB.set('gh_gist_id', gistId);
          await GH.pull();
          this.renderView(this.s.view);
          this._updateSyncDot();
          this._buildGitHubSetup();
          this.toast('Linked & pulled from GitHub ✓');
        } catch(e) {
          DB.set('gh_token', null); DB.set('gh_gist_id', null);
          document.getElementById('gh-validate-status').innerHTML = `❌ ${e.message}`;
        }
      };
    }
  },

        </div>` : ''}
        ${step > 0 ? `<button id="ob-skip" style="margin-top:12px;background:none;border:none;color:var(--t3);font-size:14px;cursor:pointer;">Skip setup</button>` : ''}

      document.getElementById('ob-next').onclick = () => {
        step++;

          DB.set('onboardingDone', true);
          this.s.activePlanId = DB.get('defaultBudgetPlanId', null) || null;
          this.renderView('dashboard');
        } else show();
      };
      const skipBtn = document.getElementById('ob-skip');
      if (skipBtn) skipBtn.onclick = () => { DB.set('onboardingDone', true); this.renderView('dashboard'); };
      const sampleBtn = document.getElementById('ob-sample');

    };

    const main = document.getElementById('main');
    // Remove active nav state during onboarding
    document.querySelectorAll('.nav-btn').forEach(b=>b.classList.remove('active'));
    show();
  },
