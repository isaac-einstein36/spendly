      <div style="display:flex;align-items:center;gap:10px;padding:20px 16px 12px;">
        <button class="hdr-btn" id="pm-back">‹</button>
        <div class="view-title" style="padding:0;">Payment Methods</div>
      </div>
      <div style="margin:0 16px 12px;background:rgba(0,122,255,.06);border:1px solid rgba(0,122,255,.15);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--t2);">
        Add your cards, accounts, and cash. Select a payment method when logging charges to see a spending breakdown by method on the Overview.
      </div>
      <div class="group">${rows}</div>
      <div style="padding:0 16px;"><button class="btn-full" id="pm-add-btn">+ Add Payment Method</button></div>
      <div style="height:16px;"></div>
    </div>`;

    document.getElementById('pm-back').onclick = () => this._buildSettings();
    document.getElementById('pm-add-btn').onclick = () => this._openPaymentMethodSheet(null, ICONS, COLORS);

    main.querySelectorAll('.btn-default-pm').forEach(btn => {
      btn.onclick = () => {
        const cur = DB.get('defaultPaymentMethod', '');
        DB.set('defaultPaymentMethod', cur === btn.dataset.id ? '' : btn.dataset.id);
        this.toast(cur === btn.dataset.id ? 'Default cleared' : 'Default set ✓');
        this._buildPaymentMethodsManager();
      };
    });

    main.querySelectorAll('.btn-edit-pm').forEach(btn => {
      btn.onclick = () => {
        const pm = this.paymentMethods()[parseInt(btn.dataset.i)];
        this._openPaymentMethodSheet(pm, ICONS, COLORS);
      };
    });
    main.querySelectorAll('.btn-del-pm').forEach(btn => {
      btn.onclick = () => {
        if (!confirm('Remove this payment method?')) return;
        const ms = this.paymentMethods();
        ms.splice(parseInt(btn.dataset.i), 1);
        this.savePaymentMethods(ms);
        this.toast('Removed');
        this._buildPaymentMethodsManager();
      };
    });
  },

  _openPaymentMethodSheet(pm, ICONS, COLORS) {
    const isNew = !pm;
    const iconBtns = ICONS.map(ic => `<button class="qa-key emoji-pick" data-e="${ic}"
      style="height:38px;font-size:20px;border-radius:8px;${ic===(pm?.icon||'💳')?'background:rgba(0,122,255,.15);outline:2px solid var(--blue);':''}">${ic}</button>`).join('');
    const swatches = COLORS.map(c => `<div class="csw ${c===(pm?.color||'#636366')?'sel':''}" style="background:${c}" data-c="${c}"></div>`).join('');

    const ov = this._overlay(`
      <div class="sheet-handle"></div>
      <div class="sheet-hdr"><span class="sheet-title">${isNew?'Add Payment Method':'Edit Payment Method'}</span><button class="sheet-close" id="pm-x">✕</button></div>
      <div class="sheet-body">
        <div class="ff"><label class="fl">Name</label>
          <input class="fi" id="pm-name" type="text" placeholder="e.g. Chase Sapphire, Venmo" value="${pm?.name||''}">
        </div>
        <div class="ff"><label class="fl">Icon</label>
          <div style="display:grid;grid-template-columns:repeat(6,1fr);gap:6px;">${iconBtns}</div>
        </div>
        <div class="ff"><label class="fl">Color</label>
          <div class="c-swatches">${swatches}</div>
        </div>
        <div class="btn-row">
          <button class="btn-s" id="pm-cancel">Cancel</button>
          <button class="btn-p" id="pm-save">Save</button>
        </div>
        <div style="height:8px;"></div>
      </div>`);

    let selIcon  = pm?.icon  || '💳';
    let selColor = pm?.color || '#636366';

    ov.querySelectorAll('.emoji-pick').forEach(b => {
      b.onclick = () => {
        ov.querySelectorAll('.emoji-pick').forEach(x=>{x.style.background='';x.style.outline='';});
        b.style.background='rgba(0,122,255,.15)'; b.style.outline='2px solid var(--blue)';
        selIcon = b.dataset.e;
      };
    });
    ov.querySelectorAll('.csw').forEach(s => {
      s.onclick = () => {
        ov.querySelectorAll('.csw').forEach(x=>x.classList.remove('sel'));
        s.classList.add('sel'); selColor = s.dataset.c;
      };
    });

    ov.querySelector('#pm-x').onclick = () => ov.remove();
    ov.querySelector('#pm-cancel').onclick = () => ov.remove();
    ov.querySelector('#pm-save').onclick = () => {
      const name = ov.querySelector('#pm-name').value.trim();
      if (!name) { this.toast('Enter a name','error'); return; }
      const methods = this.paymentMethods();
      const newPm = {
        id: pm?.id || name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'') + '-' + Date.now(),
        name, icon: selIcon, color: selColor,
      };
      if (isNew) { methods.push(newPm); }
      else { const i = methods.findIndex(m=>m.id===pm.id); if(i>=0) methods[i]=newPm; }
      this.savePaymentMethods(methods);
      ov.remove();
      this.toast(isNew?'Payment method added':'Updated');
      this._buildPaymentMethodsManager();
    };
  },

  // ── Category manager ─────────────────────────────────────────
  _buildCatManager() {
    const COLORS=['#4A6FA5','#E07A5F','#6BAB8A','#F2A65A','#9B8EA8','#5B9BD5','#8B8B8B','#48A9A6','#C97B84','#C9A84C','#6B8E6B','#A05C5C'];
    const main=document.getElementById('main');
    const rows=this.cats().map(cat=>`
      <div class="cat-mgr-item">
        <span style="font-size:20px;width:26px;text-align:center;">${cat.emoji||'💳'}</span>
        <div class="cmgr-sw" style="background:${cat.color};width:10px;height:10px;border-radius:50%;flex-shrink:0;"></div>
        <span class="cmgr-name">${cat.name}</span>
        <span class="cmgr-bud">${this._$(this.budgets()[cat.name]||0)}/mo</span>
        <button class="cmgr-btn btn-edit-c" data-name="${cat.name}">✏️</button>
        <button class="cmgr-btn btn-del-c" data-name="${cat.name}">🗑</button>
      </div>`).join('');
    main.innerHTML=`<div class="view">
      <div style="display:flex;align-items:center;gap:10px;padding:20px 16px 12px;">
        <button class="hdr-btn" id="cat-back">‹</button>
        <div class="view-title" style="padding:0;">Categories</div>
      </div>
      <div style="display:flex;gap:8px;padding:0 16px 8px;flex-wrap:wrap;">
        <button id="cat-export-btn" style="flex:1;padding:9px;border-radius:var(--r-sm);background:rgba(52,199,89,.1);color:var(--green);font-size:13px;font-weight:700;border:none;cursor:pointer;min-width:100px;">📤 Export CSV</button>
        <button id="cat-import-btn" style="flex:1;padding:9px;border-radius:var(--r-sm);background:rgba(0,122,255,.1);color:var(--blue);font-size:13px;font-weight:700;border:none;cursor:pointer;min-width:100px;">📥 Import CSV</button>
        <button id="cat-clear-btn" style="flex:1;padding:9px;border-radius:var(--r-sm);background:rgba(255,59,48,.08);color:var(--red);font-size:13px;font-weight:700;border:none;cursor:pointer;min-width:100px;">🗑 Clear All</button>
        <input type="file" id="cat-csv-input" accept=".csv" style="display:none;">
      </div>
      <div style="margin:0 16px 12px;background:rgba(0,122,255,.06);border:1px solid rgba(0,122,255,.15);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--t2);">
        <strong>CSV columns:</strong> Name, Color, Emoji, Subcategories (semicolon-separated), MonthlyBudget — export first to see the format.
      </div>
      <div class="group">${rows}</div>
      <div style="padding:0 16px;"><button class="btn-full" id="add-cat-btn">+ Add Category</button></div>
      <div style="height:16px;"></div>
    </div>`;
    document.getElementById('cat-back').onclick=()=>this._buildSettings();
    document.getElementById('add-cat-btn').onclick=()=>this._openCatSheet({name:'',color:COLORS[0],emoji:'💳',subcategories:[]},true,COLORS);

    document.getElementById('cat-clear-btn').onclick = () => {
      if (!confirm(`Remove all ${this.cats().length} categories and their budgets? Charges will keep their category names but the categories won't exist in the list.\n\nThis cannot be undone.`)) return;
      this.saveCats([]);
      this.saveBudgets({});
      this.toast('All categories cleared');
      this._buildCatManager();
    };

    // Bulk CSV export: Name, Color, Emoji, Subcategories, MonthlyBudget
    document.getElementById('cat-export-btn').onclick = () => {
      const budgets = this.budgets();
      const header  = 'Name,Color,Emoji,Subcategories,MonthlyBudget';
      const rows    = this.cats().map(c =>
        [`"${c.name}"`, `"${c.color}"`, `"${c.emoji||''}"`,
         `"${c.subcategories.join(';')}"`,
         `"${budgets[c.name]||0}"`].join(','));
      this._download('spendly_categories.csv', 'text/csv', [header,...rows].join('\n'));
      this.toast('Categories exported ✓');
    };

    // Bulk CSV import
    document.getElementById('cat-import-btn').onclick = () => document.getElementById('cat-csv-input').click();
    document.getElementById('cat-csv-input').onchange = e => {
      const file = e.target.files[0]; if(!file) return;
      const reader = new FileReader();
      reader.onload = ev => {
        try {
          const lines = ev.target.result.trim().split('\n');
          const header = lines[0].toLowerCase();
          if (!header.includes('name') || !header.includes('color')) {
            this.toast('Invalid CSV — use exported format','error'); return;
          }
          const newCats = []; const newBudgets = {...this.budgets()};
          lines.slice(1).forEach(line => {
            const cols = line.match(/("([^"]*)"|([^,]*))(,|$)/g)
              ?.map(c => c.replace(/^"|",$|",$/g,'').replace(/,$/, '').replace(/^"|"$/g,'').trim()) || [];
            const [name, color, emoji, subs, budget] = cols;
            if (!name) return;
            newCats.push({ name, color: color||'#8B8B8B', emoji: emoji||'💳',
              subcategories: subs ? subs.split(';').map(s=>s.trim()).filter(Boolean).sort((a,b)=>a.localeCompare(b)) : [] });
            if (budget) newBudgets[name] = parseFloat(budget)||0;
          });
          if (!newCats.length) { this.toast('No categories found in CSV','error'); return; }
          if (!confirm(`Import ${newCats.length} categories? This replaces your current list. Your existing charges are kept.`)) return;
          this.saveCats(newCats); this.saveBudgets(newBudgets);
          this.toast(`${newCats.length} categories imported ✓`);
          this._buildCatManager();
        } catch(err) { this.toast('Parse error: '+err.message,'error'); }
      };
      reader.readAsText(file);
      e.target.value = '';
    };
    main.querySelectorAll('.btn-edit-c').forEach(btn=>{
      btn.onclick=()=>{const cat=this.cats().find(c=>c.name===btn.dataset.name);if(cat)this._openCatSheet(cat,false,COLORS);};
    });
    main.querySelectorAll('.btn-del-c').forEach(btn=>{
      btn.onclick=()=>{
        if(!confirm(`Delete "${btn.dataset.name}"?`))return;
        this.saveCats(this.cats().filter(c=>c.name!==btn.dataset.name));
        this.toast('Category deleted');this._buildCatManager();
      };
    });
  },

  _openCatSheet(cat,isNew,COLORS){
    const EMOJIS = ['💳','🏠','🚗','👕','🍽️','🎮','🛒','📦','✈️','🐷','📱','🛡️','🏋️','🎵','📚','🐶','🍕','☕','🛍️','💊','🎁','🏖️','🍺','🎬','💇','🏥','⚡','🌿','🚂','🏠','🎓','💼','🧴','🛻','🎸','🌮','🧹','🏊','🎯','🎭','🚲','💻','🌎'];
    const swatches=COLORS.map(c=>`<div class="csw ${c===cat.color?'sel':''}" style="background:${c}" data-c="${c}"></div>`).join('');
    const emojiGrid=EMOJIS.map(e=>`<button class="qa-key emoji-pick ${e===(cat.emoji||'💳')?'sel-emoji':''}" data-e="${e}" style="height:40px;font-size:22px;border-radius:8px;${e===(cat.emoji||'💳')?'background:rgba(0,122,255,.15);outline:2px solid var(--blue);':''}">${e}</button>`).join('');
    const ov=this._overlay(`
      <div class="sheet-handle"></div>
      <div class="sheet-hdr"><span class="sheet-title">${isNew?'Add Category':'Edit Category'}</span><button class="sheet-close" id="cs-x">✕</button></div>
      <div class="sheet-body">
        <div class="ff"><label class="fl">Name</label><input class="fi" id="cs-name" value="${cat.name}" placeholder="e.g. Dining Out"></div>
        <div class="ff"><label class="fl">Subcategories (comma-separated)</label><input class="fi" id="cs-subs" value="${cat.subcategories.join(', ')}" placeholder="e.g. Restaurants, Takeout"></div>
        <div class="ff"><label class="fl">Color</label><div class="c-swatches" id="cs-colors">${swatches}</div></div>
        <div class="ff">
          <label class="fl">Icon / Emoji <span style="font-size:14px;" id="cs-emoji-preview">${cat.emoji||'💳'}</span></label>
          <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:4px;max-height:130px;overflow-y:auto;padding:4px 0;">${emojiGrid}</div>
        </div>
        <div class="btn-row"><button class="btn-s" id="cs-cancel">Cancel</button><button class="btn-p" id="cs-save">Save</button></div>
      </div>`);
    let selColor=cat.color;
    let selEmoji=cat.emoji||'💳';
    ov.querySelectorAll('.csw').forEach(s=>{s.onclick=()=>{ov.querySelectorAll('.csw').forEach(x=>x.classList.remove('sel'));s.classList.add('sel');selColor=s.dataset.c;};});
    ov.querySelectorAll('.emoji-pick').forEach(b=>{
      b.onclick=()=>{
        ov.querySelectorAll('.emoji-pick').forEach(x=>{x.style.background='';x.style.outline='';});
        b.style.background='rgba(0,122,255,.15)';b.style.outline='2px solid var(--blue)';
        selEmoji=b.dataset.e;
        const prev=document.getElementById('cs-emoji-preview');
        if(prev)prev.textContent=selEmoji;
      };
    });
    const close=()=>ov.remove();
    ov.querySelector('#cs-x').onclick=close;
    ov.querySelector('#cs-cancel').onclick=close;
    ov.querySelector('#cs-save').onclick=()=>{
      const name=ov.querySelector('#cs-name').value.trim();
      const subs=ov.querySelector('#cs-subs').value.split(',').map(s=>s.trim()).filter(Boolean).sort((a,b)=>a.localeCompare(b));
      if(!name){this.toast('Name required','error');return;}
      const cats=this.cats();
      const idx=cats.findIndex(c=>c.name===(isNew?name:cat.name));
      const nc={name,color:selColor,emoji:selEmoji,subcategories:subs};
      if(idx>=0)cats[idx]=nc; else cats.push(nc);
      this.saveCats(cats);
      close();this.toast(isNew?'Category added':'Updated');this._buildCatManager();
    };
  },

  // ── Budget Plans Manager ─────────────────────────────────────
  _buildBudgetPlansManager() {
    const main  = document.getElementById('main');
    const plans = this.budgetPlans();
    const ICONS = ['📅','✈️','🏖️','🎄','🏠','🚗','💊','🎓','💼','🎮','🏋️','🎁','🌮','☕','🎵'];
    const COLORS= ['#007aff','#34c759','#ff9500','#ff3b30','#5856d6','#30b0c7','#E07A5F','#48A9A6','#C97B84','#6BAB8A'];
    const defaultId = DB.get('defaultBudgetPlanId','');

    const rows = plans.map((p,i) => {
      const limCount = Object.keys(p.categoryLimits||{}).filter(k=>(p.categoryLimits[k]||0)>0).length;
      const isDefault = p.id === defaultId;
      return `<div class="set-item">
        <div class="set-icon" style="background:${p.color};font-size:16px;">${p.icon}</div>
        <div style="flex:1;min-width:0;">
          <div class="set-name">${p.name}${isDefault?' <span style="font-size:11px;color:var(--green);font-weight:400;">✓ default</span>':''}</div>
          <div style="font-size:12px;color:var(--t2);">${limCount>0?`${limCount} category limits`:'No category limits'}${p.monthlyLimit?` · ${this._$(p.monthlyLimit)}/mo`:''}</div>
        </div>
        <button class="cmgr-btn btn-dflt-plan" data-id="${p.id}" style="font-size:11px;padding:4px 8px;background:${isDefault?'rgba(52,199,89,.15)':'var(--bg)'};color:${isDefault?'var(--green)':'var(--t3)'};">Default</button>
        <button class="cmgr-btn btn-edit-plan" data-i="${i}" style="background:rgba(0,122,255,.1);color:var(--blue);">✏️</button>
        ${plans.length>1?`<button class="cmgr-btn btn-del-plan" data-i="${i}" style="background:rgba(255,59,48,.1);color:var(--red);">🗑</button>`:''}
      </div>`;
    }).join('');

    main.innerHTML = `<div class="view">
      <div style="display:flex;align-items:center;gap:10px;padding:20px 16px 12px;">
        <button class="hdr-btn" id="bpm-back">‹</button>
        <div class="view-title" style="padding:0;">Budget Plans</div>
      </div>
      <div style="margin:0 16px 12px;background:rgba(0,122,255,.06);border:1px solid rgba(0,122,255,.15);border-radius:var(--r);padding:10px 12px;font-size:12px;color:var(--t2);line-height:1.5;">
        Create named budgets — Monthly, Travel, Holiday. Select a plan on the Overview to filter spending to that plan. Tag individual charges to plans when logging them. Plans can have optional per-category limits or just a total monthly limit.
      </div>
      <div class="group">${rows||'<div style="padding:16px;text-align:center;color:var(--t3);">No plans yet</div>'}</div>
      <div style="padding:0 16px;"><button class="btn-full" id="bpm-add">+ New Budget Plan</button></div>
      <div style="height:16px;"></div>
    </div>`;

    document.getElementById('bpm-back').onclick = () => this._buildSettings();
    document.getElementById('bpm-add').onclick   = () => this._openBudgetPlanSheet(null, ICONS, COLORS);
    main.querySelectorAll('.btn-dflt-plan').forEach(btn => {
      btn.onclick = () => {
        DB.set('defaultBudgetPlanId', btn.dataset.id === defaultId ? '' : btn.dataset.id);
        this.toast(btn.dataset.id === defaultId ? 'Default cleared' : 'Default set ✓');
        this._buildBudgetPlansManager();
      };
    });
    main.querySelectorAll('.btn-edit-plan').forEach(btn => {
      btn.onclick = () => this._openBudgetPlanSheet(plans[parseInt(btn.dataset.i)], ICONS, COLORS);
    });
    main.querySelectorAll('.btn-del-plan').forEach(btn => {
      btn.onclick = () => {
        if (!confirm(`Delete "${plans[parseInt(btn.dataset.i)].name}"?`)) return;
        const updated = plans.filter((_,i)=>i!==parseInt(btn.dataset.i));
        this.saveBudgetPlans(updated);
        if (this.s.activePlanId === plans[parseInt(btn.dataset.i)].id) this.s.activePlanId = null;
        this.toast('Plan deleted');
        this._buildBudgetPlansManager();
      };
    });
  },

  _openBudgetPlanSheet(plan, ICONS, COLORS) {
    const isNew = !plan;
    const cats  = this.cats();
    const existing = plan?.categoryLimits || {};

    const iconBtns = ICONS.map(ic => `<button class="qa-key emoji-pick" data-e="${ic}"
      style="height:38px;font-size:20px;border-radius:8px;${ic===(plan?.icon||'📅')?'background:rgba(0,122,255,.15);outline:2px solid var(--blue);':''}">${ic}</button>`).join('');
    const swatches = COLORS.map(c => `<div class="csw ${c===(plan?.color||'#007aff')?'sel':''}" style="background:${c}" data-c="${c}"></div>`).join('');

    const catRows = cats.map(cat => `
      <div style="display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:.5px solid var(--border);">
        <span style="font-size:16px;flex-shrink:0;">${cat.emoji||'💳'}</span>
        <span style="flex:1;font-size:14px;font-weight:500;">${cat.name}</span>
        <div class="amt-wrap" style="width:110px;flex-shrink:0;">
          <span class="amt-pre" style="font-size:13px;">$</span>
          <input class="fi amt plan-cat-input" data-cat="${cat.name}" type="number"
            inputmode="decimal" step="1" min="0" style="padding:6px 8px;font-size:14px;"
            value="${existing[cat.name]||''}" placeholder="—">
        </div>
      </div>`).join('');

    const ov = this._overlay(`
      <div class="sheet-handle"></div>
      <div class="sheet-hdr"><span class="sheet-title">${isNew?'New Budget Plan':'Edit Plan'}</span><button class="sheet-close" id="bps-x">✕</button></div>
      <div class="sheet-body">
        <div class="ff"><label class="fl">Plan Name</label>
          <input class="fi" id="bps-name" type="text" placeholder="e.g. Travel, Holiday, Monthly" value="${plan?.name||''}"></div>
        <div class="ff"><label class="fl">Icon</label>
          <div style="display:grid;grid-template-columns:repeat(8,1fr);gap:4px;">${iconBtns}</div></div>
        <div class="ff"><label class="fl">Color</label>
          <div class="c-swatches">${swatches}</div></div>
        <div class="ff">
          <label class="fl">Total monthly limit <span style="font-size:11px;color:var(--t3);">optional — leave blank for no overall cap</span></label>
          <div class="amt-wrap"><span class="amt-pre">$</span>
            <input class="fi amt" id="bps-total" type="number" inputmode="decimal" step="1" min="0"
              value="${plan?.monthlyLimit||''}" placeholder="e.g. 2000"></div>
        </div>
        <div class="ff">
          <label class="fl">Per-category limits <span style="font-size:11px;color:var(--t3);">all optional — blank = no limit for that category</span></label>
          ${catRows}
        </div>
        <div class="btn-row">
          <button class="btn-s" id="bps-cancel">Cancel</button>
          <button class="btn-p" id="bps-save">Save Plan</button>
        </div>
        <div style="height:8px;"></div>
      </div>`);

    let selIcon  = plan?.icon  || '📅';
    let selColor = plan?.color || '#007aff';

    ov.querySelectorAll('.emoji-pick').forEach(b => {
      b.onclick = () => {
        ov.querySelectorAll('.emoji-pick').forEach(x=>{x.style.background='';x.style.outline='';});
        b.style.background='rgba(0,122,255,.15)'; b.style.outline='2px solid var(--blue)';
        selIcon = b.dataset.e;
      };
    });
    ov.querySelectorAll('.csw').forEach(s => {
      s.onclick = () => { ov.querySelectorAll('.csw').forEach(x=>x.classList.remove('sel')); s.classList.add('sel'); selColor=s.dataset.c; };
    });

    ov.querySelector('#bps-x').onclick = () => ov.remove();
    ov.querySelector('#bps-cancel').onclick = () => ov.remove();
    ov.querySelector('#bps-save').onclick = () => {
      const name = ov.querySelector('#bps-name').value.trim();
      if (!name) { this.toast('Enter a plan name','error'); return; }
      const categoryLimits = {};
      ov.querySelectorAll('.plan-cat-input').forEach(inp => {
        const v = parseFloat(inp.value);
        if (v > 0) categoryLimits[inp.dataset.cat] = v;
      });
      const totalLimit = parseFloat(ov.querySelector('#bps-total').value) || null;
      const newPlan = {
        id: plan?.id || 'plan-' + Date.now(),
        name, icon: selIcon, color: selColor,
        categoryLimits,
        monthlyLimit: totalLimit,
      };
      const plans = this.budgetPlans();
      if (isNew) { plans.push(newPlan); }
      else { const i=plans.findIndex(p=>p.id===plan.id); if(i>=0)plans[i]=newPlan; }
      this.saveBudgetPlans(plans);
      ov.remove();
      this.toast(isNew?'Plan created ✓':'Plan updated ✓');
      this._buildBudgetPlansManager();
    };
  },

  // ── Budget Manager (global monthly budgets) ─────────────────
  _buildBudgetManager() {
    const main=document.getElementById('main');
    const rows=this.cats().map(cat=>`
      <div class="budget-row">
        <div class="bsw" style="background:${cat.color}"></div>
        <span class="bname">${cat.name}</span>
        <input class="binput" type="number" inputmode="decimal" data-cat="${cat.name}" value="${this.budgets()[cat.name]||''}">
        <span style="font-size:13px;color:var(--t2);">/mo</span>
      </div>`).join('');
    main.innerHTML=`<div class="view">
      <div style="display:flex;align-items:center;gap:10px;padding:20px 16px 12px;">
        <button class="hdr-btn" id="bud-back">‹</button>
        <div class="view-title" style="padding:0;">Budgets</div>
      </div>
      <div class="group">${rows}</div>
      <div style="padding:0 16px;"><button class="btn-full" id="save-bud">✓ Save Budgets</button></div>
      <div style="height:16px;"></div>
    </div>`;
    document.getElementById('bud-back').onclick=()=>this._buildSettings();
    document.getElementById('save-bud').onclick=()=>{
      const bud=this.budgets();
      main.querySelectorAll('.binput').forEach(inp=>{bud[inp.dataset.cat]=parseFloat(inp.value)||0;});
      this.saveBudgets(bud);this.toast('Budgets saved!');
    };
  },

  // ── Add / Edit charge sheet ───────────────────────────────────
  _bindAdd(){
    document.getElementById('add-btn').addEventListener('click', () => this._openTxSheet({}, true));
  },

  // Quick-add: native amount input + category picker
  _openQuickAdd() {
    const cats = this.cats();
    const catBtns = cats.map(c=>`<button class="qa-cat" data-cat="${c.name}" style="border-color:${c.color}20;">
      <span>${c.emoji||'💳'}</span><span>${c.name}</span>
    </button>`).join('');

    const ov = document.createElement('div');
    ov.className = 'quick-add-overlay';
    ov.innerHTML = `<div class="quick-add-sheet">
      <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
        <div style="font-size:16px;font-weight:700;">Quick Add</div>
        <div style="display:flex;gap:8px;">
          <button id="qa-full-btn" style="font-size:13px;padding:5px 12px;border-radius:99px;background:rgba(0,122,255,.1);color:var(--blue);font-weight:600;border:none;cursor:pointer;">Full Form</button>
          <button id="qa-close" style="width:28px;height:28px;border-radius:50%;background:var(--bg);color:var(--t2);font-size:14px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;">✕</button>
        </div>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;margin-bottom:4px;background:var(--bg);border-radius:var(--r);padding:8px 16px;">
        <span style="font-size:28px;font-weight:300;color:var(--t3);margin-right:4px;line-height:1;flex-shrink:0;">$</span>
        <input id="qa-amt" type="text" inputmode="decimal"
          placeholder="0.00 or 12+34" autocomplete="off" autocorrect="off"
          style="font-size:32px;font-weight:700;letter-spacing:-1px;padding:4px 0;border:none;background:transparent;min-width:0;flex:1;outline:none;color:var(--t1);text-align:left;">
      </div>
      <div id="qa-expr-hint" style="font-size:12px;color:var(--blue);text-align:right;padding-right:12px;min-height:18px;margin-bottom:10px;font-family:monospace;"></div>
      <div class="qa-cats" id="qa-cats">${catBtns}</div>
      <button class="qa-save-btn" id="qa-save" disabled>Save</button>
    </div>`;
    document.body.appendChild(ov);

    const amtInp  = ov.querySelector('#qa-amt');
    const hint    = ov.querySelector('#qa-expr-hint');
    const saveBtn = ov.querySelector('#qa-save');
    let selCat = '';

    const updateSave = () => {
      const val = this._evalExpr(amtInp.value.trim());
      saveBtn.disabled = !val || val <= 0 || !selCat;
    };

    amtInp.addEventListener('input', () => {
      const raw = amtInp.value.trim();
      if (/[+\-\*\/x×÷]/.test(raw)) {
        const r = this._evalExpr(raw);
        hint.textContent = r !== null ? `= $${r.toFixed(2)}` : '';
      } else { hint.textContent = ''; }
      updateSave();
    });

    ov.querySelectorAll('.qa-cat').forEach(btn => {
      btn.addEventListener('click', () => {
        ov.querySelectorAll('.qa-cat').forEach(b=>{b.classList.remove('sel');b.style.background='';});
        const cat = cats.find(c=>c.name===btn.dataset.cat);
        btn.classList.add('sel');
        btn.style.background = cat ? cat.color : 'var(--blue)';
        selCat = btn.dataset.cat;
        updateSave();
      });
    });

    ov.querySelector('#qa-close').onclick = () => ov.remove();
    ov.querySelector('#qa-full-btn').onclick = () => { ov.remove(); this._openTxSheet({},true); };
    ov.addEventListener('click', e => { if(e.target===ov) ov.remove(); });

    saveBtn.onclick = () => {
      const amount = this._evalExpr(amtInp.value.trim());
      if (!amount||!selCat) return;
      this.addTx({ amount, category:selCat, date:this._today(), payee:'', note:'' });
      ov.remove();
      this.toast('Charge saved! 🎉');
      this._refreshView();
    };

    // Auto-focus the amount input
    setTimeout(() => { amtInp.focus(); }, 200);
  },

  _openTxSheet(tx, isNew){
    this.s.editingTx = isNew ? null : tx;
    const cats=this.cats();
    const catOpts=cats.map(c=>`<option value="${c.name}" ${c.name===tx.category?'selected':''}>${c.icon||c.emoji||''} ${c.name}</option>`).join('');

    // Build split pills HTML if tx has splits
    const splits = tx.splits || [];
    const splitPills = splits.map((sp,i)=>`
      <div class="split-pill" data-si="${i}">
        <div class="split-pill-cat">${this._catIcon(sp.category)} ${sp.category}</div>
        <div class="split-pill-amt">${this._$(sp.amount)}</div>
        <button class="split-pill-del" data-si="${i}">✕</button>
      </div>`).join('');

    const ov=this._overlay(`
      <div class="sheet-handle"></div>
      <div class="sheet-hdr">
        <span class="sheet-title">${isNew?'Log Charge':'Edit Charge'}</span>
        <button class="sheet-close" id="ts-x">✕</button>
      </div>
      <div class="sheet-body">
        <div class="ff">
          <label class="fl" style="display:flex;align-items:center;justify-content:space-between;">
            <span>Amount <span id="ts-expr-preview" style="font-size:11px;color:var(--blue);font-weight:400;margin-left:6px;font-family:monospace;"></span></span>
          </label>
          <div class="amt-wrap">
            <span class="amt-pre">$</span>
            <input class="fi amt" id="ts-amt" type="text" inputmode="decimal"
              value="${tx.amount ? Math.abs(tx.amount) : ''}" placeholder="0.00" autocomplete="off" autocorrect="off" autocapitalize="off">
          </div>
          <div style="display:flex;align-items:center;gap:8px;margin-top:8px;">
            <div style="display:flex;gap:6px;align-items:center;">
              <button type="button" class="arith-btn" data-op="+">+</button>
              <button type="button" class="arith-btn" data-op="-">−</button>
              <button type="button" class="arith-btn" data-op="*">×</button>
              <button type="button" class="arith-btn" data-op="/">÷</button>
            </div>
            <div style="flex:1;"></div>
            <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;font-weight:600;color:var(--t2);">
              <div id="credit-toggle-wrap" style="width:36px;height:22px;border-radius:11px;background:${tx.amount<0?'var(--green)':'rgba(120,120,128,.2)'};position:relative;transition:background .2s;flex-shrink:0;">
                <div id="credit-toggle-knob" style="width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:${tx.amount<0?'16px':'2px'};transition:left .2s;box-shadow:0 1px 3px rgba(0,0,0,.2);"></div>
              </div>
              <span id="credit-toggle-lbl" style="color:${tx.amount<0?'var(--green)':'var(--t2)'};">${tx.amount<0?'↩️ Credit/Return':'Credit/Return'}</span>
            </label>
          </div>
        </div>
        <div class="ff"><label class="fl">Date</label>
          <input class="fi" id="ts-date" type="date" value="${tx.date||this._today()}"></div>
        <div class="ff"><label class="fl">Payee / Where</label>
          <div class="ac-wrap">
            <input class="fi" id="ts-payee" type="text" placeholder="e.g. Amazon, Chipotle…" value="${tx.payee||''}" autocomplete="off" autocorrect="off">
            <div class="ac-list hidden" id="ac-list"></div>
          </div>
        </div>

        <div class="ff">
          <label class="fl">Budget Plan <span style="font-size:11px;color:var(--t3);font-weight:400;">select all that apply</span></label>
          <div id="ts-plan-chips" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px;">
            ${this.budgetPlans().map(p => {
              const sel = tx.budget_ids ? tx.budget_ids.includes(p.id)
                : (isNew ? (this.s.activePlanId === p.id || DB.get('defaultBudgetPlanId','') === p.id) : false);
              return `<button type="button" class="plan-chip ts-plan-btn ${sel?'plan-chip-active':''}"
                data-pid="${p.id}" style="${sel?`background:${p.color};color:#fff;border-color:${p.color};`:''}">
                ${p.icon} ${p.name}</button>`;
            }).join('')}
          </div>
        </div>

        <div id="ts-budget-cats">
          <!-- Populated dynamically based on selected plans -->
        </div>

        <div class="ff"><label class="fl">Note</label>
          <input class="fi" id="ts-note" type="text" placeholder="Optional…" value="${tx.note||''}"></div>
        <div class="ff"><label class="fl">Payment Method</label>
          <select class="fs" id="ts-payment">
            <option value="">Select…</option>
            ${this.paymentMethods().map(p=>`<option value="${p.id}" ${(tx.payment_method||(isNew?DB.get('defaultPaymentMethod',''):''))===p.id?'selected':''}>${p.icon} ${p.name}</option>`).join('')}
          </select>
        </div>

        <!-- Split charge section -->
        <div id="split-section">
          <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;">
            <label class="fl" style="margin:0;">Split Charge</label>
            <button id="ts-add-split" style="font-size:12px;padding:4px 10px;border-radius:99px;background:rgba(88,86,214,.1);color:var(--indigo);font-weight:600;border:none;cursor:pointer;">+ Add Split</button>
          </div>
          <div id="split-pills"></div>
          <div id="split-remaining" style="font-size:12px;color:var(--t2);margin-bottom:8px;display:none;"></div>
        </div>

        <div class="btn-row">
          ${!isNew?`<button class="btn-del" id="ts-del">Delete</button>`:''}
          <button class="btn-p" id="ts-save">${isNew?'Save Charge':'Update Charge'}</button>
        </div>
        ${isNew?`<button id="ts-save-recur" style="width:100%;padding:12px;margin-top:8px;border-radius:var(--r);background:rgba(88,86,214,.1);color:var(--indigo);font-size:14px;font-weight:700;border:none;cursor:pointer;">🔁 Save as Recurring</button>`:''}
        ${!isNew&&!tx.recurring_id?`<button id="ts-make-recur-edit" style="width:100%;padding:12px;margin-top:8px;border-radius:var(--r);background:rgba(88,86,214,.1);color:var(--indigo);font-size:14px;font-weight:700;border:none;cursor:pointer;">🔁 Make This Recurring</button>`:''}
        ${!isNew&&tx.recurring_id?`<div style="padding:8px 0 2px;text-align:center;font-size:13px;color:var(--indigo);">🔁 Auto-logged recurring charge · <button onclick="App._buildRecurringManager()" style="background:none;border:none;color:var(--blue);font-size:13px;cursor:pointer;padding:0;">Edit in Settings</button></div>`:''}
        <div style="height:8px;"></div>
      </div>`);

    // Focus amount
    setTimeout(()=>{ const a=ov.querySelector('#ts-amt'); if(a){a.focus();a.select();} },300);

    // Arithmetic on amount field
    const amtInp  = ov.querySelector('#ts-amt');
    const exprPrev = ov.querySelector('#ts-expr-preview');
    let isCredit = (tx.amount||0) < 0;

    // Credit toggle
    const creditWrap = ov.querySelector('#credit-toggle-wrap');
    const creditKnob = ov.querySelector('#credit-toggle-knob');
    const creditLbl  = ov.querySelector('#credit-toggle-lbl');
    if (creditWrap) {
      creditWrap.addEventListener('click', () => {
        isCredit = !isCredit;
        creditWrap.style.background = isCredit ? 'var(--green)' : 'rgba(120,120,128,.2)';
        creditKnob.style.left = isCredit ? '16px' : '2px';
        creditLbl.textContent = isCredit ? '↩️ Credit/Return' : 'Credit/Return';
        creditLbl.style.color = isCredit ? 'var(--green)' : 'var(--t2)';
      });
    }

    // Live arithmetic preview
    amtInp.addEventListener('input', () => {
      const raw = amtInp.value.trim();
      exprPrev.textContent = /[+\-\*\/x×÷−]/.test(raw)
        ? (r => r !== null ? `= $${r.toFixed(2)}` : '= ?')(this._evalExpr(raw))
        : '';
    });
    amtInp.addEventListener('blur', () => {
      const raw = amtInp.value.trim();
      if (/[+\-\*\/x×÷−]/.test(raw)) {
        const r = this._evalExpr(raw);
        if (r !== null) { amtInp.value = r.toFixed(2); exprPrev.textContent = ''; }
      }
    });
    ov.querySelectorAll('.arith-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cur = amtInp.value.trim();
        if (cur && !/[+\-\*\/]$/.test(cur)) {
          amtInp.value = cur + btn.dataset.op;
          amtInp.dispatchEvent(new Event('input'));
        }
        amtInp.focus();
      });
    });

    // Payee autocomplete
    const payeeInp = ov.querySelector('#ts-payee');
    const acList   = ov.querySelector('#ac-list');
    payeeInp.addEventListener('input', () => {
      const q = payeeInp.value.toLowerCase();
      if (!q) { acList.classList.add('hidden'); return; }
      const matches = this.payees().filter(p=>p.toLowerCase().includes(q));
      if (!matches.length) { acList.classList.add('hidden'); return; }
      acList.innerHTML = matches.slice(0,6).map(p=>`<div class="ac-item">${p}</div>`).join('');
      acList.classList.remove('hidden');
      acList.querySelectorAll('.ac-item').forEach(item => {
        item.addEventListener('mousedown', e => { e.preventDefault(); payeeInp.value=item.textContent; acList.classList.add('hidden'); });
      });
    });
    payeeInp.addEventListener('blur', () => setTimeout(()=>acList.classList.add('hidden'),150));

    // ── Dynamic per-plan category rows ───────────────────────────
    const buildCatRow = (planId, planName, planColor, existingCat, existingSub) => {
      const rowId = planId || 'global';
      const opts  = `<option value="">Select…</option>${catOpts}`;
      return `<div class="ff plan-cat-row" data-plan="${rowId}">
        <label class="fl" style="color:${planColor||'var(--t2)'};">
          ${planName ? `📋 ${planName} — Category` : 'Category'}
        </label>
        <select class="fs plan-cat-sel" data-plan="${rowId}" id="ts-cat-${rowId}">
          ${cats.map(c=>`<option value="${c.name}" ${c.name===existingCat?'selected':''}>${c.emoji||'💳'} ${c.name}</option>`).join('')}
        </select>
        <div class="ff plan-sub-ff" id="ts-sub-ff-${rowId}" style="${existingCat?'':'display:none'}">
          <label class="fl">Subcategory</label>
          <select class="fs plan-sub-sel" data-plan="${rowId}" id="ts-sub-${rowId}"><option value="">Select…</option></select>
        </div>
      </div>`;
    };

    const refreshCatRows = () => {
      const container = ov.querySelector('#ts-budget-cats');
      if (!container) return;
      const selPlans = [...ov.querySelectorAll('.ts-plan-btn.plan-chip-active')]
        .map(b => this.budgetPlans().find(p=>p.id===b.dataset.pid)).filter(Boolean);

      if (selPlans.length === 0) {
        // No plan selected — single global category row
        const prevCat = ov.querySelector('.plan-cat-sel')?.value || tx.category || '';
        const prevSub = ov.querySelector('.plan-sub-sel')?.value || tx.subcategory || '';
        container.innerHTML = buildCatRow(null, '', '', prevCat, prevSub);
      } else {
        // One row per plan
        container.innerHTML = selPlans.map(p => {
          // Preserve previously entered values if re-rendering
          const prevSel = ov.querySelector(`#ts-cat-${p.id}`);
          const prevCat = prevSel?.value || (tx.budget_ids?.includes(p.id) ? tx.category : '') || '';
          const prevSub = ov.querySelector(`#ts-sub-${p.id}`)?.value || (tx.budget_ids?.includes(p.id) ? tx.subcategory : '') || '';
          return buildCatRow(p.id, p.name, p.color, prevCat, prevSub);
        }).join('');
      }

      // Wire subcategory dropdowns for each row
      container.querySelectorAll('.plan-cat-sel').forEach(sel => {
        const rowId = sel.dataset.plan;
        if (sel.value) this._fillSubSelect(`ts-sub-${rowId}`, `ts-sub-ff-${rowId}`, sel.value,
          ov.querySelector(`#ts-sub-${rowId}`)?.value || '', ov);
        sel.addEventListener('change', e => {
          this._fillSubSelect(`ts-sub-${rowId}`, `ts-sub-ff-${rowId}`, e.target.value, '', ov);
        });
      });
    };

    // Initial render
    refreshCatRows();

    // Budget plan multi-select toggle → re-render category rows
    ov.querySelectorAll('.ts-plan-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const plan = this.budgetPlans().find(p=>p.id===btn.dataset.pid);
        const active = btn.classList.toggle('plan-chip-active');
        btn.style.background  = active ? (plan?.color||'var(--blue)') : '';
        btn.style.color       = active ? '#fff' : '';
        btn.style.borderColor = active ? (plan?.color||'var(--blue)') : '';
        refreshCatRows();
      });
    });

    // Note + payment method (global, not per-plan)
    // These elements are still in the form below ts-budget-cats

    // Split charge logic
    let liveSplits = [...splits];
    const refreshSplits = () => {
      const pills     = ov.querySelector('#split-pills');
      const remaining = ov.querySelector('#split-remaining');
      if (!pills) return;
      const totalAmt   = this._evalExpr(ov.querySelector('#ts-amt')?.value?.trim()||'0') || 0;
      const splitTotal = liveSplits.reduce((s,p)=>s+p.amount, 0);
      const rem        = Math.round((totalAmt - splitTotal) * 100) / 100;

      pills.innerHTML = liveSplits.map((sp,i)=>`
        <div class="split-pill" data-si="${i}">
          <div style="flex:1;min-width:0;">
            <div style="display:flex;align-items:center;gap:6px;">
              <span style="font-size:14px;">${this._catIcon(sp.category)}</span>
              <span class="split-pill-cat">${sp.category}${sp.subcategory?' · <span style="color:var(--t2);font-size:12px;">'+sp.subcategory+'</span>':''}</span>
              <span class="split-pill-amt">${this._$(sp.amount)}</span>
            </div>
            ${sp.note?`<div style="font-size:11px;color:var(--t3);margin-top:2px;padding-left:22px;">${sp.note}</div>`:''}
          </div>
          <button class="split-pill-edit" data-si="${i}" style="width:28px;height:28px;border-radius:50%;background:rgba(0,122,255,.1);color:var(--blue);font-size:13px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0;">✏️</button>
          <button class="split-pill-del"  data-si="${i}" style="width:28px;height:28px;border-radius:50%;background:rgba(255,59,48,.1);color:var(--red);font-size:13px;display:flex;align-items:center;justify-content:center;border:none;cursor:pointer;flex-shrink:0;">✕</button>
        </div>`).join('');

      pills.querySelectorAll('.split-pill-del').forEach(b => {
        b.onclick = () => { liveSplits.splice(parseInt(b.dataset.si),1); refreshSplits(); };
      });
      pills.querySelectorAll('.split-pill-edit').forEach(b => {
        b.onclick = () => { const i=parseInt(b.dataset.si); this._openSplitPicker(0,cats,liveSplits[i],r=>{liveSplits[i]=r;refreshSplits();}); };
      });

      if (remaining) {
        remaining.style.display = liveSplits.length ? '' : 'none';
        if (liveSplits.length) {
          const over = rem < -0.01;
          remaining.innerHTML = over
            ? `<span style="color:var(--red);">⚠️ Split total exceeds charge by ${this._$(Math.abs(rem))}</span>`
            : rem > 0.01
            ? `<span style="color:var(--t2);">${this._$(splitTotal)} split · <strong style="color:var(--green);">${this._$(rem)} unallocated</strong></span>`
            : `<span style="color:var(--green);">✓ Fully split — ${this._$(splitTotal)}</span>`;
        }
      }
    };

    refreshSplits();
    ov.querySelector('#ts-amt')?.addEventListener('blur', refreshSplits);
    ov.querySelector('#ts-add-split')?.addEventListener('click', () => {
      const totalAmt = this._evalExpr(ov.querySelector('#ts-amt')?.value?.trim()||'0') || 0;
      const used     = liveSplits.reduce((s,p)=>s+p.amount, 0);
      this._openSplitPicker(Math.max(0, Math.round((totalAmt-used)*100)/100), cats, null, r => { liveSplits.push(r); refreshSplits(); });
    });

    const close = () => ov.remove();
    ov.querySelector('#ts-x').onclick = close;
    ov.addEventListener('click', e => { if(e.target===ov) close(); });
    ov.querySelector('#ts-del')?.addEventListener('click', () => {
      if (!confirm('Delete this charge?')) return;
      this.deleteTx(tx.id); close(); this.toast('Charge deleted'); this._refreshView();
    });

    // ── collectData reads from dynamic rows ──────────────────────
    const collectData = () => {
      const raw = ov.querySelector('#ts-amt').value.trim();
      const absAmount = this._evalExpr(raw);
      const amount = absAmount !== null ? (isCredit ? -absAmount : absAmount) : null;
      const date   = ov.querySelector('#ts-date').value;
      const selectedPlanIds = [...ov.querySelectorAll('.ts-plan-btn.plan-chip-active')].map(b=>b.dataset.pid);

      // Collect category per plan (or single global)
      const catRows = [...ov.querySelectorAll('.plan-cat-row')];
      // Primary category = first row's selection
      const primaryCat = catRows[0] ? catRows[0].querySelector('.plan-cat-sel')?.value : '';
      const primarySub = catRows[0] ? catRows[0].querySelector('.plan-sub-sel')?.value  : '';

      // Per-plan category map: { planId: { category, subcategory } }
      const planCats = {};
      catRows.forEach(row => {
        const pid = row.dataset.plan;
        if (pid && pid !== 'global') {
          planCats[pid] = {
            category:    row.querySelector('.plan-cat-sel')?.value  || '',
            subcategory: row.querySelector('.plan-sub-sel')?.value  || '',
          };
        }
      });

      return {
        amount, date,
        category:    primaryCat,
        subcategory: primarySub,
        payee:          ov.querySelector('#ts-payee').value.trim(),
        note:           ov.querySelector('#ts-note').value.trim(),
        payment_method: ov.querySelector('#ts-payment')?.value || undefined,
        budget_ids:     selectedPlanIds.length ? selectedPlanIds : undefined,
        plan_cats:      Object.keys(planCats).length ? planCats : undefined,
      };
    };

    ov.querySelector('#ts-save').onclick=()=>{
      const d = collectData();
      if(d.amount===null||d.amount===0){this.toast('Enter a valid amount','error');return;}
      if(!d.date){this.toast('Select a date','error');return;}
      // When using plans, category per plan is tracked; global category is optional
      if(!d.category && !d.plan_cats){this.toast('Select a category','error');return;}

      // Validate splits don't exceed total
      if (liveSplits.length > 0) {
        const splitTotal = liveSplits.reduce((s,p)=>s+p.amount,0);
        if (splitTotal > Math.abs(d.amount) + 0.01) {
          this.toast('Split total exceeds charge amount','error'); return;
        }
      }

      const splitGroupId = liveSplits.length > 0 ? crypto.randomUUID() : undefined;
      const planIds = d.budget_ids || [];

      // Helper: build list of tx objects to save
      // If plan_cats has entries, save one tx per plan (each with its plan's category)
      // Otherwise save a single tx with the global category
      const buildTxList = (baseData) => {
        if (d.plan_cats && Object.keys(d.plan_cats).length > 0) {
          return Object.entries(d.plan_cats).map(([pid, pc]) => ({
            ...baseData,
            category:    pc.category    || baseData.category || '',
            subcategory: pc.subcategory || baseData.subcategory || '',
            budget_ids:  [pid],
          }));
        }
        return [baseData];
      };

      if (isNew) {
        if (liveSplits.length > 0) {
          liveSplits.forEach(sp => {
            buildTxList({...d, amount:sp.amount, category:sp.category,
              subcategory:sp.subcategory||'', note:sp.note||d.note,
              split_group:splitGroupId, split_parent_payee:d.payee}).forEach(t=>this.addTx(t));
          });
          const splitTotal = liveSplits.reduce((s,p)=>s+p.amount,0);
          const rem = Math.round((d.amount - splitTotal) * 100) / 100;
          if (rem > 0.01) buildTxList({...d, amount:rem, split_group:splitGroupId}).forEach(t=>this.addTx(t));
        } else {
          buildTxList(d).forEach(t=>this.addTx(t));
        }
      } else {
        if (liveSplits.length > 0) {
          this.deleteTx(tx.id);
          liveSplits.forEach(sp => {
            buildTxList({...d, amount:sp.amount, category:sp.category,
              subcategory:sp.subcategory||'', note:sp.note||d.note,
              split_group:splitGroupId, split_parent_payee:d.payee}).forEach(t=>this.addTx(t));
          });
          const splitTotal = liveSplits.reduce((s,p)=>s+p.amount,0);
          const rem = Math.round((d.amount - splitTotal) * 100) / 100;
          if (rem > 0.01) buildTxList({...d, amount:rem, split_group:splitGroupId}).forEach(t=>this.addTx(t));
        } else {
          const txList = buildTxList(d);
          if (txList.length === 1) {
            this.updateTx(tx.id, txList[0]);
          } else {
            this.deleteTx(tx.id);
            txList.forEach(t=>this.addTx(t));
          }
        }
      }

      close();
      this.toast(isNew ? 'Charge saved! 🎉' : 'Charge updated');
      this._refreshView();
    };

    const makeRecurFn = (alsoSave) => {
      const d = collectData();
      if(d.amount===null||d.amount===0){this.toast('Enter a valid amount','error');return;}
      if(!d.category && !d.plan_cats){this.toast('Select a category','error');return;}
      // Check not already recurring
      const existingRecur = !isNew && tx.recurring_id ? this.recurring().find(r=>r.id===tx.recurring_id) : null;
      if (existingRecur) { this.toast('Already a recurring charge — edit it in Settings → Recurring','error'); return; }
      const rec = {
        id: crypto.randomUUID(),
        active: true,
        amount: d.amount, category: d.category,
        subcategory: d.subcategory, payee: d.payee, note: d.note,
        day: new Date(d.date+'T12:00:00').getDate() || new Date().getDate(),
        freq: 'monthly',
        startYM: d.date?.substring(0,7) || this._today().substring(0,7),
      };
      const recs = this.recurring(); recs.push(rec); this.saveRecurring(recs);
      if (alsoSave) {
        if (isNew) this.addTx(d); else this.updateTx(tx.id, {...d, recurring_id: rec.id});
      }
      close();
      this.toast('Saved as recurring! 🔁');
      this._refreshView();
    };

    const saveRecurBtn = ov.querySelector('#ts-save-recur');
    if (saveRecurBtn) saveRecurBtn.onclick = () => makeRecurFn(true);

    const makeRecurEditBtn = ov.querySelector('#ts-make-recur-edit');
    if (makeRecurEditBtn) makeRecurEditBtn.onclick = () => makeRecurFn(false);
  },

  // ── Category month drilldown sheet ───────────────────────────
  _openCatMonthSheet(catName, month, year) {
    const ym  = `${year}-${String(month).padStart(2,'0')}`;
    const cat = this.cats().find(c=>c.name===catName);
    const color = cat?.color || '#8B8B8B';
    const emoji = this._catIcon(catName);
    const txs = this.txs()
      .filter(t => t.category===catName && t.date?.startsWith(ym))
      .sort((a,b) => b.date.localeCompare(a.date));

    const total = txs.reduce((s,t)=>s+t.amount,0);
    const credits = txs.filter(t=>t.amount<0).reduce((s,t)=>s+t.amount,0);
    const charges = txs.filter(t=>t.amount>=0).reduce((s,t)=>s+t.amount,0);

    const rows = txs.length ? txs.map(t => {
      const isCredit = t.amount < 0;
      const pm = t.payment_method ? this.paymentMethods().find(p=>p.id===t.payment_method) : null;
      const sub = [t.subcategory, t.note].filter(Boolean).join(' · ');
      return `<div class="tx-item" data-id="${t.id}" style="cursor:pointer;">
        <div class="tx-icon" style="background:${color}18;font-size:17px;">${isCredit?'↩️':emoji}</div>
        <div class="tx-info">
          <div class="tx-title">${t.payee||catName}${pm?` <span style="font-size:11px;">${pm.icon}</span>`:''}</div>
          <div class="tx-sub">${t.date.substring(8)} ${t.date.substring(5,7)>0?this._monthFull(parseInt(t.date.substring(5,7))).substring(0,3):''}${sub?' · '+sub:''}</div>
        </div>
        <div class="tx-amt" style="color:${isCredit?'var(--green)':'var(--t1)'};font-weight:700;">${isCredit?'-':''}${this._$(Math.abs(t.amount))}</div>
      </div>`;
    }).join('') : '<div style="padding:20px;text-align:center;color:var(--t3);font-size:14px;">No charges this month</div>';

    const ov = this._overlay(`
      <div class="sheet-handle"></div>
      <div class="sheet-hdr">
        <span class="sheet-title">${emoji} ${catName}</span>
        <button class="sheet-close" id="cms-x">✕</button>
      </div>
      <div class="sheet-body" style="padding:0;">
        <div style="display:flex;gap:0;border-bottom:.5px solid var(--border);">
          <div style="flex:1;padding:12px 16px;text-align:center;border-right:.5px solid var(--border);">
            <div style="font-size:11px;color:var(--t2);margin-bottom:2px;">Charges</div>
            <div style="font-size:17px;font-weight:700;">${this._$(charges)}</div>
          </div>
          ${credits<0?`<div style="flex:1;padding:12px 16px;text-align:center;border-right:.5px solid var(--border);">
            <div style="font-size:11px;color:var(--t2);margin-bottom:2px;">Credits</div>
            <div style="font-size:17px;font-weight:700;color:var(--green);">${this._$(Math.abs(credits))}</div>
          </div>`:''}
          <div style="flex:1;padding:12px 16px;text-align:center;">
            <div style="font-size:11px;color:var(--t2);margin-bottom:2px;">Net</div>
            <div style="font-size:17px;font-weight:700;color:${total<0?'var(--green)':'var(--t1)'};">${total<0?'-':''}${this._$(Math.abs(total))}</div>
          </div>
        </div>
        <div class="group" style="margin:12px 16px;">${rows}</div>
        <div style="padding:0 16px 8px;"><button class="btn-full" id="cms-add">+ Log charge in ${catName}</button></div>
        <div style="height:8px;"></div>
      </div>`);

    ov.querySelector('#cms-x').onclick = () => ov.remove();
    ov.querySelector('#cms-add').onclick = () => {
      ov.remove();
      this._openTxSheet({ category: catName, date: `${ym}-${String(new Date().getDate()).padStart(2,'0')}` }, true);
    };
    ov.querySelectorAll('.tx-item[data-id]').forEach(el => {
      el.onclick = () => {
        const tx = this.txs().find(t=>t.id===el.dataset.id);
        if (tx) { ov.remove(); this._openTxSheet(tx, false); }
      };
    });
  },

  _openSplitPicker(suggestedAmt, cats, existingSplit, onSave) {
    const isEdit = !!existingSplit;
    const catOpts = cats.map(c=>`<option value="${c.name}" ${existingSplit?.category===c.name?'selected':''}>${c.emoji||'💳'} ${c.name}</option>`).join('');
    const ov = this._overlay(`
      <div class="sheet-handle"></div>
      <div class="sheet-hdr"><span class="sheet-title">${isEdit?'Edit Split':'Add Split'}</span><button class="sheet-close" id="sp-x">✕</button></div>
      <div class="sheet-body">
        <div class="ff"><label class="fl">Amount for this split <span id="sp-expr-preview" style="font-size:11px;color:var(--blue);font-weight:400;margin-left:4px;font-family:monospace;"></span></label>
          <div class="amt-wrap"><span class="amt-pre">$</span>
            <input class="fi amt" id="sp-amt" type="text" inputmode="decimal" autocorrect="off"
              value="${existingSplit?.amount>0?existingSplit.amount.toFixed(2):suggestedAmt>0?suggestedAmt.toFixed(2):''}" placeholder="0.00">
          </div>
          <div style="display:flex;gap:6px;margin-top:6px;">
            <button type="button" class="arith-btn" data-op="+">+</button>
            <button type="button" class="arith-btn" data-op="-">−</button>
            <button type="button" class="arith-btn" data-op="*">×</button>
            <button type="button" class="arith-btn" data-op="/">÷</button>
          </div></div>
        <div class="ff"><label class="fl">Category</label>
          <select class="fs" id="sp-cat"><option value="">Select…</option>${catOpts}</select></div>
        <div class="ff" id="sp-sub-ff" style="${existingSplit?.category?'':'display:none'}">
          <label class="fl">Subcategory</label>
          <select class="fs" id="sp-sub"><option value="">Select…</option></select></div>
        <div class="ff"><label class="fl">Note <span style="font-size:11px;color:var(--t3);">optional</span></label>
          <input class="fi" id="sp-note" type="text" placeholder="e.g. Produce, Paper towels…" value="${existingSplit?.note||''}"></div>
        <div class="btn-row">
          <button class="btn-s" id="sp-cancel">Cancel</button>
          <button class="btn-p" id="sp-save">${isEdit?'Update Split':'Add Split'}</button>
        </div>
        <div style="height:8px;"></div>
      </div>`);

    // Pre-fill subcategory if editing
    if (existingSplit?.category) {
      this._fillSubSelect('sp-sub','sp-sub-ff', existingSplit.category, existingSplit.subcategory||'', ov);
    }
    ov.querySelector('#sp-cat').addEventListener('change', e => {
      this._fillSubSelect('sp-sub','sp-sub-ff', e.target.value, '', ov);
    });

    setTimeout(()=>{const a=ov.querySelector('#sp-amt');if(a){a.focus();a.select();}},200);

    // Arithmetic in split amount field
    const spAmt  = ov.querySelector('#sp-amt');
    const spPrev = ov.querySelector('#sp-expr-preview');
    spAmt.addEventListener('input', () => {
      const raw = spAmt.value.trim();
      if (/[+\-\*\/x×÷−]/.test(raw)) {
        const r = this._evalExpr(raw);
        spPrev.textContent = r !== null ? `= $${r.toFixed(2)}` : '= ?';
      } else { spPrev.textContent = ''; }
    });
    spAmt.addEventListener('blur', () => {
      const raw = spAmt.value.trim();
      if (/[+\-\*\/x×÷−]/.test(raw)) {
        const r = this._evalExpr(raw);
        if (r !== null) { spAmt.value = r.toFixed(2); spPrev.textContent = ''; }
      }
    });
    ov.querySelectorAll('.arith-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const cur = spAmt.value.trim();
        if (cur && !/[+\-\*\/]$/.test(cur)) {
          spAmt.value = cur + btn.dataset.op;
          spAmt.dispatchEvent(new Event('input'));
        }
        spAmt.focus();
      });
    });
    ov.querySelector('#sp-x').onclick=()=>ov.remove();
    ov.querySelector('#sp-cancel').onclick=()=>ov.remove();
    ov.querySelector('#sp-save').onclick=()=>{
      const amt = this._evalExpr(ov.querySelector('#sp-amt').value.trim());
      const cat = ov.querySelector('#sp-cat').value;
      const sub = ov.querySelector('#sp-sub').value;
      const note= ov.querySelector('#sp-note').value.trim();
      if(!amt||amt<=0){this.toast('Enter a valid amount','error');return;}
      if(!cat){this.toast('Select a category','error');return;}
      ov.remove();
      onSave({category:cat, subcategory:sub, note, amount:amt});
    };
  },

  _fillSubSelect(selId,ffId,catName,selectedSub,scope){
    const root=scope||document;
    const cat=this.cats().find(c=>c.name===catName);
    const sel=root.getElementById?root.getElementById(selId):root.querySelector('#'+selId);
    const ff =root.getElementById?root.getElementById(ffId) :root.querySelector('#'+ffId);
    if(!sel)return;
    sel.innerHTML='<option value="">Select…</option>';
    if(cat&&cat.subcategories.length>0){
      ff.style.display='';
      cat.subcategories.forEach(sub=>{
        const opt=document.createElement('option');
        opt.value=sub;opt.textContent=sub;
        if(sub===selectedSub)opt.selected=true;
        sel.appendChild(opt);
      });
    } else { if(ff)ff.style.display='none'; }
  },

  // ── Overlay helper ────────────────────────────────────────────
  _overlay(html) {
    const ov=document.createElement('div');
    ov.className='overlay';
    ov.innerHTML=`<div class="sheet">${html}</div>`;
    document.body.appendChild(ov);
    ov.addEventListener('click',e=>{if(e.target===ov)ov.remove();});
    return ov;
  },

  // ── Misc helpers ─────────────────────────────────────────────
  _refreshView(){
    const v=this.s.view;
    if     (v==='dashboard')    this._buildDashboard();
    else if(v==='transactions') this._buildTransactions();
    else if(v==='calendar')     this._buildCalendar();
  },

  toast(msg, type){
    const el=document.getElementById('toast');
    el.textContent=msg; el.className='toast'; el.classList.remove('hidden');
    clearTimeout(this._tt);
    this._tt=setTimeout(()=>el.classList.add('hidden'),2600);
  },

  _today(){
    const d=new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  },
  _$(n){ return '$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:0,maximumFractionDigits:0}); },
  _k(n){ return n>=1000?Math.round(n/100)/10+'k':Math.round(n).toString(); },
  _monthFull(m){ return ['January','February','March','April','May','June','July','August','September','October','November','December'][m-1]; },
  _dateLabel(d){
    if(!d)return'Unknown';
    const dt=new Date(d+'T12:00:00'),t=this._today();
    if(d===t)return'Today';
    const yd=new Date();yd.setDate(yd.getDate()-1);
    const ys=`${yd.getFullYear()}-${String(yd.getMonth()+1).padStart(2,'0')}-${String(yd.getDate()).padStart(2,'0')}`;
    if(d===ys)return'Yesterday';
    return dt.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric'});
  },
  _catIcon(catName){
    const cat = this.cats().find(c=>c.name===catName);
    if (cat?.emoji) return cat.emoji;
    // fallback for old data without emoji field
    const m={'Rent':'🏠','Car':'🚗','Clothing':'👕','Eating Out':'🍽️','Entertainment':'🎮','Groceries':'🛒','Miscellaneous':'📦','Travel':'✈️','Savings':'🐷','Phone':'📱','Insurance':'🛡️'};
    return m[catName]||'💳';
  },

  // ── Recurring charge manager ─────────────────────────────────
  _buildRecurringManager() {
    const main = document.getElementById('main');
    const recs = this.recurring();
    const FREQ_LABELS = { monthly:'Monthly', bimonthly:'Every 2 months', quarterly:'Quarterly', biannual:'Twice/year', annual:'Annual' };
    const rows = recs.length ? recs.map(r => `
      <div class="set-item" style="opacity:${r.active?1:.45};">
        <div class="set-icon" style="background:${this.cats().find(c=>c.name===r.category)?.color||'#8B8B8B'};">
          ${this._catIcon(r.category)}
        </div>
        <div style="flex:1;min-width:0;">
          <div class="set-name">${r.payee||r.category} <span style="font-size:12px;color:var(--t2);font-weight:400;">· ${this._$(r.amount)}</span></div>
          <div style="font-size:12px;color:var(--t2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${r.category}${r.subcategory?' · '+r.subcategory:''} · day ${r.day||1} · ${FREQ_LABELS[r.freq||'monthly']||'Monthly'}</div>
        </div>
        <button class="cmgr-btn" style="background:rgba(0,122,255,.1);color:var(--blue);flex-shrink:0;" data-rid="${r.id}" data-action="edit">✏️</button>
        <button class="cmgr-btn" style="background:${r.active?'rgba(255,59,48,.1)':'rgba(52,199,89,.1)'};color:${r.active?'var(--red)':'var(--green)'};flex-shrink:0;" data-rid="${r.id}" data-action="toggle">${r.active?'Pause':'▶'}</button>
        <button class="cmgr-btn btn-del-c" data-rid="${r.id}" data-action="delete" style="flex-shrink:0;">🗑</button>
      </div>`).join('') :
      '<div style="padding:20px;text-align:center;color:var(--t3);font-size:14px;">No recurring charges yet.<br>Save a charge as recurring from the Log Charge form.</div>';

    main.innerHTML = `<div class="view">
      <div style="display:flex;align-items:center;gap:10px;padding:20px 16px 12px;">
        <button class="hdr-btn" id="rec-back">‹</button>
        <div class="view-title" style="padding:0;">Recurring Charges</div>
      </div>
      <div style="margin:0 16px 12px;background:rgba(0,122,255,.06);border:1px solid rgba(0,122,255,.15);border-radius:var(--r);padding:12px 14px;">
        <div style="font-size:13px;color:var(--t2);line-height:1.5;">Auto-post each month/period on the day you set. 🔁 badges appear on auto-logged entries. Tap ✏️ to change the day or frequency.</div>
      </div>
      <div class="group">${rows}</div>
      <div style="height:16px;"></div>
    </div>`;

    document.getElementById('rec-back').onclick = () => this._buildSettings();
    main.querySelectorAll('[data-action="edit"]').forEach(btn => {
      btn.onclick = () => {
        const r = this.recurring().find(x=>x.id===btn.dataset.rid);
        if (r) this._openRecurringEditSheet(r);
      };
    });
    main.querySelectorAll('[data-action="toggle"]').forEach(btn => {
      btn.onclick = () => {
        const recs = this.recurring();
        const idx = recs.findIndex(r=>r.id===btn.dataset.rid);
        if (idx>=0) { recs[idx].active = !recs[idx].active; this.saveRecurring(recs); this._buildRecurringManager(); }
      };
    });
    main.querySelectorAll('[data-action="delete"]').forEach(btn => {
      btn.onclick = () => {
        if (!confirm('Remove this recurring charge?')) return;
        this.saveRecurring(this.recurring().filter(r=>r.id!==btn.dataset.rid));
        this.toast('Recurring charge removed');
        this._buildRecurringManager();
      };
    });
  },

  _openRecurringEditSheet(r) {
    const FREQS = [
      {v:'monthly',    l:'Monthly (every month)'},
      {v:'bimonthly',  l:'Every 2 months'},
      {v:'quarterly',  l:'Quarterly (every 3 months)'},
      {v:'biannual',   l:'Twice a year (every 6 months)'},
      {v:'annual',     l:'Annual (once a year)'},
    ];
    const freqOpts = FREQS.map(f=>`<option value="${f.v}" ${(r.freq||'monthly')===f.v?'selected':''}>${f.l}</option>`).join('');
    const ov = this._overlay(`
      <div class="sheet-handle"></div>
      <div class="sheet-hdr"><span class="sheet-title">Edit Recurring</span><button class="sheet-close" id="re-x">✕</button></div>
      <div class="sheet-body">
        <div style="background:var(--bg);border-radius:var(--r-sm);padding:12px 14px;margin-bottom:14px;">
          <div style="font-size:15px;font-weight:700;">${r.payee||r.category}</div>
          <div style="font-size:13px;color:var(--t2);margin-top:2px;">${r.category}${r.subcategory?' · '+r.subcategory:''} · ${this._$(r.amount)}</div>
        </div>
        <div class="ff">
          <label class="fl">Amount</label>
          <div class="amt-wrap"><span class="amt-pre">$</span>
            <input class="fi amt" id="re-amt" type="number" inputmode="decimal" step="0.01" min="0" value="${r.amount}" placeholder="0.00">
          </div>
        </div>
        <div class="ff">
          <label class="fl">Day of month (1–28)</label>
          <input class="fi" id="re-day" type="number" inputmode="numeric" min="1" max="28" value="${r.day||1}" placeholder="1">
          <div style="font-size:11px;color:var(--t3);margin-top:4px;">Use 1–28 to avoid month-length issues (e.g. Feb). Day 1 = first of each period.</div>
        </div>
        <div class="ff">
          <label class="fl">Frequency</label>
          <select class="fs" id="re-freq">${freqOpts}</select>
        </div>
        <div class="ff">
          <label class="fl">Start month (YYYY-MM)</label>
          <input class="fi" id="re-start" type="month" value="${r.startYM||''}">
          <div style="font-size:11px;color:var(--t3);margin-top:4px;">Charges won't auto-post before this month.</div>
        </div>
        <div class="btn-row">
          <button class="btn-s" id="re-cancel">Cancel</button>
          <button class="btn-p" id="re-save">Save</button>
        </div>
        <div style="height:8px;"></div>
      </div>`);
    ov.querySelector('#re-x').onclick = () => ov.remove();
    ov.querySelector('#re-cancel').onclick = () => ov.remove();
    ov.querySelector('#re-save').onclick = () => {
      const day  = Math.min(28, Math.max(1, parseInt(ov.querySelector('#re-day').value)||1));
      const freq = ov.querySelector('#re-freq').value;
      const amt  = parseFloat(ov.querySelector('#re-amt').value);
      const startYM = ov.querySelector('#re-start').value || r.startYM;
      if (!amt || amt <= 0) { this.toast('Enter a valid amount','error'); return; }
      const recs = this.recurring();
      const idx  = recs.findIndex(x=>x.id===r.id);
      if (idx >= 0) { recs[idx] = {...recs[idx], day, freq, amount: amt, startYM}; this.saveRecurring(recs); }
      ov.remove();
      this.toast('Recurring charge updated ✓');
      this._buildRecurringManager();
    };
  },

  // ── Start Date picker ────────────────────────────────────────
  _openStartDatePicker() {
    const cur = DB.get('startDate', '');
    const ov = this._overlay(`
      <div class="sheet-handle"></div>
      <div class="sheet-hdr"><span class="sheet-title">Tracking Start Date</span><button class="sheet-close" id="sd-x">✕</button></div>
      <div class="sheet-body">
        <div style="background:rgba(0,122,255,.06);border:1px solid rgba(0,122,255,.15);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;font-size:13px;color:var(--t2);line-height:1.6;">
          Sets the month you started using Spendly. Averages and projections use this as the baseline instead of January 1st.<br><br>
          E.g. if you started in May 2026, averages are calculated over May–now, not January–now.
        </div>
        <div class="ff">
          <label class="fl">Start Month</label>
          <input class="fi" id="sd-month" type="month" value="${cur}">
        </div>
        <div class="btn-row">
          <button class="btn-s" id="sd-clear">Clear (use Jan 1)</button>
          <button class="btn-p" id="sd-save">Save</button>
        </div>
        <div style="height:8px;"></div>
      </div>`);
    ov.querySelector('#sd-x').onclick = () => ov.remove();
    ov.querySelector('#sd-clear').onclick = () => { DB.set('startDate', null); ov.remove(); this.toast('Start date cleared'); this._buildSettings(); };
    ov.querySelector('#sd-save').onclick = () => {
      const v = ov.querySelector('#sd-month').value;
      if (!v) { this.toast('Pick a month first','error'); return; }
      DB.set('startDate', v);
      ov.remove();
      this.toast('Start date saved ✓');
      this._buildSettings();
    };
  },

  // ── Budget rollover computation ──────────────────────────────
  _computeRollover() {
    const budgets  = this.budgets();
    const txs      = this.txs();
    const rollover = {};
    const now      = new Date();
    const curY     = now.getFullYear();
    const curM     = now.getMonth() + 1;

    if (!txs.length) { this.saveRollover({}); return; }

    // Pre-aggregate spending by "cat||YYYY-MM" in a single pass — O(n)
    const spendMap = {};
    txs.forEach(t => {
      if (!t.date || !t.category) return;
      const ym  = t.date.substring(0, 7);
      const key = `${t.category}||${ym}`;
      spendMap[key] = (spendMap[key] || 0) + t.amount;
    });

    // Find earliest YYYY-MM across all transactions
    let earliestYM = `${curY}-${String(curM).padStart(2,'0')}`;
    txs.forEach(t => { if (t.date && t.date.substring(0,7) < earliestYM) earliestYM = t.date.substring(0,7); });
    const startY = parseInt(earliestYM.substring(0,4));
    const startM = parseInt(earliestYM.substring(5,7));

    this.cats().forEach(cat => {
      const budget = budgets[cat.name] || 0;
      if (!budget) return;
      rollover[cat.name] = {};
      let carry = 0;
      let y = startY, m = startM;

      // Walk months from earliest to current — O(months) per category, no inner filter
      while (y < curY || (y === curY && m <= curM)) {
        const ym    = `${y}-${String(m).padStart(2,'0')}`;
        const spent = spendMap[`${cat.name}||${ym}`] || 0;
        const surplus = (budget + carry) - spent;
        // next month gets the carry
        let ny = y, nm = m + 1;
        if (nm > 12) { nm = 1; ny++; }
        const nextYm = `${ny}-${String(nm).padStart(2,'0')}`;
        rollover[cat.name][nextYm] = surplus > 0 ? surplus : 0;
        carry = surplus > 0 ? surplus : 0;
        m++; if (m > 12) { m = 1; y++; }
      }
    });

    this.saveRollover(rollover);
  },

  // Safe arithmetic expression evaluator (no eval)
  _evalExpr(raw) {
    if (!raw) return null;
    // Replace display chars with standard operators
    const s = raw.replace(/×/g,'*').replace(/÷/g,'/').replace(/x/gi,'*').replace(/−/g,'-').trim();
    // If it's a plain number, just parse it
    if (/^[\d.]+$/.test(s)) return parseFloat(s) || null;
    // Tokenize: numbers and operators only
    const tokens = s.match(/[\d.]+|[+\-\*\/]/g);
    if (!tokens) return null;
    try {
      // Simple left-to-right with operator precedence via two-pass
      // First pass: handle * and /
      let nums = [], ops = [];
      tokens.forEach(t => {
        if (/[\d.]+/.test(t)) nums.push(parseFloat(t));
        else ops.push(t);
      });
      if (nums.length !== ops.length + 1) return null;
      // Multiply/divide pass
      let i = 0;
      while (i < ops.length) {
        if (ops[i]==='*' || ops[i]==='/') {
          const res = ops[i]==='*' ? nums[i]*nums[i+1] : nums[i]/nums[i+1];
          nums.splice(i, 2, res);
          ops.splice(i, 1);
        } else { i++; }
      }
      // Add/subtract pass
      let result = nums[0];
      for (let j=0; j<ops.length; j++) {
        result = ops[j]==='+' ? result+nums[j+1] : result-nums[j+1];
      }
      const r = Math.round(result * 100) / 100;
      return isFinite(r) && r > 0 ? r : null;
    } catch { return null; }
  },

  _catEmoji(cat){ return this._catIcon(cat); },
};

document.addEventListener('DOMContentLoaded', () => App.init());
</script>
